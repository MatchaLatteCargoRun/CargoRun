name: Validate CargoRun recovery baseline on Linux

on:
  push:
    branches:
      - recovery/cbb579c-controlled

permissions:
  contents: read

jobs:
  validate_recovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/cbb579c-controlled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22.23.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Set up npm 11.11.0
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund

      - name: Verify exact baseline application source
        run: node scripts/verify-recovery-source.js --source

      - name: Validate recovery package without deployment
        run: node scripts/validate-linux-release.js
