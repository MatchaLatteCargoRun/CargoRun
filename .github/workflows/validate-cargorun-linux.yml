name: Validate CargoRun Linux runtime

on:
  push:
    branches:
      - validation/sql-driver-upgrade-20261018

permissions:
  contents: read

jobs:
  validate_linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/sql-driver-upgrade-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validation source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22.23.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Set up npm 11.11.0
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund

      - name: Validate isolated Linux release candidate
        run: node scripts/validate-linux-release.js

  rehearse_deployment_build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/sql-driver-upgrade-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up tested Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Install locked runtime dependencies
        run: npx --yes npm@11.11.0 ci --prefix api --ignore-scripts --omit=dev --engine-strict --no-audit --no-fund

      - name: Prepare verified historical offline fixture
        run: node scripts/prepare-offline-driver-fixture.js --github-env

      - name: Run offline test suite
        shell: bash
        run: node --test --test-concurrency=1 | tee "$RUNNER_TEMP/deployment-rehearsal.tap"

      - name: Block unresolved dependency advisories
        run: npx --yes --package=npm@11.11.0 -- node scripts/dependency-security-gate.js --context production --target cargorun-dev

      - name: Build and validate allowlisted deployment package
        run: node scripts/build-deployment-package.js

      - name: Verify rehearsal evidence and negative fixture controls
        run: node scripts/verify-deployment-rehearsal.js
