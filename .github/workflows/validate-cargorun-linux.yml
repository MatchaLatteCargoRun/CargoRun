name: Validate CargoRun Linux runtime

on:
  push:
    branches:
      - validation/akl-runtime-linux

permissions:
  contents: read

jobs:
  validate_linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/akl-runtime-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validation source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22.23.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Set up npm 11.11.0
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund

      - name: Validate isolated Linux release candidate
        run: node scripts/validate-linux-release.js