name: Deploy CargoRun to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Deploy CargoRun

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up tested Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Install locked runtime dependencies
        run: npx --yes npm@11.11.0 ci --prefix api --ignore-scripts --omit=dev --engine-strict --no-audit --no-fund

      - name: Run offline test suite
        run: node --test --test-concurrency=1

      - name: Block unresolved dependency advisories
        run: npx --yes --package=npm@11.11.0 -- node scripts/dependency-security-gate.js --context production

      - name: Build and validate allowlisted deployment package
        run: node scripts/build-deployment-package.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ".release/public"
          api_location: ".release/api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
