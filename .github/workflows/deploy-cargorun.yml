name: Recover CargoRun baseline to existing Static Web App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/recovery/cbb579c-controlled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved recovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22.23.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Verify exact baseline application source
        run: node scripts/verify-recovery-source.js --source

      - name: Install locked runtime dependencies
        run: npx --yes npm@11.11.0 ci --prefix api --ignore-scripts --omit=dev --engine-strict --no-audit --no-fund

      - name: Run baseline and security regression tests
        run: node --test --test-concurrency=1

      - name: Block unresolved dependency advisories
        run: npx --yes --package=npm@11.11.0 -- node scripts/dependency-security-gate.js --context production --target cargorun-dev

      - name: Build allowlisted recovery package
        run: node scripts/build-deployment-package.js

      - name: Verify complete recovery package
        run: node scripts/verify-recovery-source.js --package .release

      - name: Deploy to existing CargoRun Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: "recovery/cbb579c-controlled"
          app_location: ".release/public"
          api_location: ".release/api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
