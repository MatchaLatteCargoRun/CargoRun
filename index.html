<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#063f61" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CargoRun" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>CargoRun</title>
<style>
  :root{
    --bg:#0d557b;
    --bg-deep:#063f61;
    --panel:#08466a;
    --panel2:#0a5c83;
    --text:#f7fbff;
    --muted:#b9d2df;
    --line:rgba(255,255,255,.13);
    --green:#36d399;
    --amber:#ffc857;
    --red:#ff6b6b;
    --blue:#71c5ff;
    --shadow:0 18px 50px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#0d557b 0%,#084766 100%);color:var(--text)}
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;height:68px;background:rgba(5,53,82,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
  .brand img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
  .brand span{font-size:22px}
  .station{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05)}
  .shell{width:min(1080px,100%);margin:0 auto;padding:22px 18px 40px}
  .hero{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:4px 0 22px}
  .hero h1{font-size:clamp(27px,4vw,42px);line-height:1.05;margin:0 0 6px}
  .hero p{margin:0;color:var(--muted);font-size:14px}
  .hero-logo{width:110px;opacity:.95;filter:drop-shadow(0 12px 22px rgba(0,0,0,.18))}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .menu-card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(4,58,87,.92),rgba(4,48,74,.92));border-radius:18px;padding:22px;min-height:135px;color:white;text-align:left;box-shadow:var(--shadow);transition:.18s ease;position:relative;overflow:hidden}
  .menu-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)}
  .menu-card .title{font-size:22px;font-weight:800;margin-bottom:7px}
  .menu-card .sub{color:var(--muted);font-size:13px;max-width:80%}
  .menu-card .metric{position:absolute;right:18px;bottom:16px;font-weight:900;font-size:28px;color:white}
  .menu-card.alert .metric{color:var(--red)}
  .menu-card.warn .metric{color:var(--amber)}
  .toolbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .back,.secondary,.primary,.danger,.status-btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:white;background:rgba(255,255,255,.06);font-weight:700}
  .primary{background:#0b6d96;border-color:#1284b3}
  .danger{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.45);color:#ffd8d8}
  .spacer{flex:1}
  .screen-title{font-size:30px;font-weight:900;margin:8px 0 3px}
  .screen-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .flight-list,.uld-list,.offload-list{display:flex;flex-direction:column;gap:10px}
  .flight-row,.uld-row,.offload-row{display:grid;align-items:center;gap:12px;background:rgba(4,58,87,.86);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:0 8px 22px rgba(0,0,0,.13)}
  .flight-row{grid-template-columns:1.2fr 1.2fr .9fr;cursor:pointer}
  .flight-row:hover,.offload-row:hover{border-color:rgba(255,255,255,.28)}
  .flight-code{font-weight:900;font-size:22px;letter-spacing:.3px}
  .shcs{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:900;letter-spacing:.4px;padding:5px 8px;border-radius:999px;background:rgba(113,197,255,.14);color:#cdeeff;border:1px solid rgba(113,197,255,.26)}
  .chip.hot{background:rgba(255,200,87,.13);color:#ffe7a8;border-color:rgba(255,200,87,.28)}
  .chip.red{background:rgba(255,107,107,.13);color:#ffd0d0;border-color:rgba(255,107,107,.28)}
  .count{text-align:right;font-weight:900;font-size:14px}
  .count small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
  .progress{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
  .progress>span{display:block;height:100%;background:#7dd3fc}
  .uld-row{grid-template-columns:1fr 1.2fr auto}
  .uld-num{font-weight:900;font-size:17px}
  .uld-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .uld-inline-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .uld-flag{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:950;letter-spacing:.55px;text-transform:uppercase;border:1px solid transparent;line-height:1}
  .uld-flag.intact{background:rgba(54,211,153,.12);border-color:rgba(54,211,153,.26);color:#baf7df}
  .uld-flag.breakdown{background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.26);color:#ffe7a8}
  .uld-flag.dhl{background:#ffd94f;border-color:#ffe27f;color:#b32020;box-shadow:0 6px 16px rgba(0,0,0,.10)}
  .uld-flag.priority{background:rgba(255,107,107,.13);border-color:rgba(255,107,107,.28);color:#ffd0d0}
  .uld-flag .flag-dot{font-size:9px;line-height:1}
  .status-btn{min-width:120px;text-transform:uppercase;font-size:11px;letter-spacing:.55px}
  .status-unarrived,.status-warehouse,.status-requested{color:#f3f6f8;background:rgba(255,255,255,.07)}
  .status-arrived,.status-transit{color:#ffe3a0;background:rgba(255,200,87,.14);border-color:rgba(255,200,87,.28)}
  .status-received,.status-at-aircraft,.status-complete{color:#baf7df;background:rgba(54,211,153,.13);border-color:rgba(54,211,153,.28)}
  .detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:15px}
  .detail-head .flight-code{font-size:36px}
  .summary{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .summary span{padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:800}
  .offload-row{grid-template-columns:1fr 1.15fr 1fr auto;cursor:pointer}
  .offload-row strong{font-size:16px}
  .offload-row .bay{text-align:center;font-weight:900;font-size:17px}
  .empty{padding:30px;text-align:center;border:1px dashed rgba(255,255,255,.2);border-radius:16px;color:var(--muted)}
  .modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,22,35,.68);backdrop-filter:blur(7px)}
  .modal-wrap.show{display:flex}
  .modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#073f60;border:1px solid rgba(255,255,255,.18);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.45);padding:22px}
  .modal.wide{width:min(1120px,96vw)}
  .modal h2{margin:0 0 7px;font-size:24px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
  .field{margin:12px 0}
  .field label{display:block;font-size:12px;font-weight:800;color:#d9edf6;margin-bottom:6px}
  .field input,.field textarea{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.17);background:#052f49;color:white;padding:12px 13px;outline:none}
  .field textarea{min-height:130px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:#6ec8f3;box-shadow:0 0 0 3px rgba(110,200,243,.12)}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
  .filebox{border:1px dashed rgba(255,255,255,.24);border-radius:12px;padding:12px;color:var(--muted);font-size:12px}
  .toast{position:fixed;z-index:150;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#072f47;border:1px solid rgba(255,255,255,.18);color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);transition:.2s ease;max-width:min(90vw,560px);font-weight:700;font-size:13px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .footer-note{color:rgba(255,255,255,.42);font-size:11px;text-align:center;margin-top:25px}
  .hero-mascot-wrap{width:210px;max-width:35vw;display:flex;align-items:center;justify-content:center}
  .hero-mascot{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 34px rgba(0,0,0,.20))}

  /* ===== CargoRun loading + operation feedback ===== */
  .cargo-loader{position:fixed;inset:0;z-index:260;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 42%,rgba(13,85,123,.98),rgba(4,45,70,.99) 70%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease}
  .cargo-loader.show{opacity:1;visibility:visible;pointer-events:auto}
  .cargo-loader-card{width:min(390px,92vw);text-align:center}
  .cargo-loader-brand{font-size:13px;font-weight:950;letter-spacing:1.5px;text-transform:uppercase;color:#cdeeff;margin-bottom:8px}
  .cargo-loader-title{font-size:24px;font-weight:900;color:#fff;margin:0}
  .cargo-loader-sub{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:18px}
  .cargo-loader-track{position:relative;width:min(220px,68vw);height:112px;margin:18px auto 8px;overflow:hidden}
  .cargo-loader-track::after{content:'';position:absolute;left:15%;right:15%;bottom:18px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(113,197,255,.28),rgba(255,255,255,.75),rgba(113,197,255,.28),transparent);box-shadow:0 0 18px rgba(113,197,255,.24)}
  .cargo-loader-runner{position:absolute;left:50%;bottom:21px;width:76px;height:76px;margin-left:-38px;display:flex;align-items:center;justify-content:center;animation:cargoRunnerSpot .78s ease-in-out infinite}
  .cargo-loader-runner img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
  .cargo-loader-speed{position:absolute;left:50%;bottom:49px;width:52px;height:2px;margin-left:-78px;border-radius:999px;background:rgba(205,238,255,.58);box-shadow:0 -11px 0 rgba(205,238,255,.26),0 11px 0 rgba(205,238,255,.34);animation:cargoSpeedSpot .78s ease-in-out infinite}
  .cargo-loader-dots{display:flex;justify-content:center;gap:7px;margin-top:4px}
  .cargo-loader-dots i{display:block;width:7px;height:7px;border-radius:50%;background:#71c5ff;opacity:.28;animation:cargoDot 1.15s ease-in-out infinite}
  .cargo-loader-dots i:nth-child(2){animation-delay:.16s}.cargo-loader-dots i:nth-child(3){animation-delay:.32s}
  @keyframes cargoRunnerSpot{0%{transform:translateY(0) scaleX(1) rotate(-1deg)}25%{transform:translateY(-5px) scaleX(1.02) rotate(1deg)}50%{transform:translateY(0) scaleX(.98) rotate(-1deg)}75%{transform:translateY(-4px) scaleX(1.02) rotate(1deg)}100%{transform:translateY(0) scaleX(1) rotate(-1deg)}}
  @keyframes cargoSpeedSpot{0%,100%{opacity:.18;transform:translateX(0) scaleX(.7)}50%{opacity:.75;transform:translateX(8px) scaleX(1.08)}}
  @keyframes cargoDot{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .action-loader{position:fixed;inset:0;z-index:320;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,28,44,.66);backdrop-filter:blur(3px);opacity:0;visibility:hidden;pointer-events:none;transition:.15s ease}
  .action-loader.show{opacity:1;visibility:visible;pointer-events:auto}
  .action-loader-card{width:min(310px,88vw);padding:22px 20px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(150deg,#07547c,#063e5d);box-shadow:0 20px 70px rgba(0,0,0,.34);text-align:center}
  .action-loader-runner{position:relative;width:120px;height:88px;margin:0 auto 3px;display:flex;align-items:center;justify-content:center}
  .action-loader-runner::after{content:'';position:absolute;left:20%;right:20%;bottom:8px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(113,197,255,.22),rgba(255,255,255,.68),rgba(113,197,255,.22),transparent);box-shadow:0 0 14px rgba(113,197,255,.18)}
  .action-loader-runner img{width:74px;height:74px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));animation:cargoRunnerSpot .78s ease-in-out infinite}
  .action-loader-title{font-weight:950;font-size:17px;color:#fff;margin-top:5px}.action-loader-sub{font-size:11px;color:#c6e3f0;margin-top:5px;min-height:16px}
  .priority-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.priority-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;border:1px solid rgba(255,200,87,.30);background:rgba(255,200,87,.12);color:#ffe7a8;font-size:10px;font-weight:950;letter-spacing:.3px}.priority-badge.critical{border-color:rgba(255,107,107,.34);background:rgba(255,107,107,.12);color:#ffd0d0}.priority-badge.mail{border-color:rgba(113,197,255,.34);background:rgba(113,197,255,.11);color:#d7f1ff}.priority-badge.temp{border-color:rgba(35,175,188,.40);background:rgba(35,175,188,.13);color:#c6fbff}
  .offload-instruction{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,200,87,.20);background:rgba(255,200,87,.07);color:#ffe8b2;font-size:11px;line-height:1.4}.offload-instruction strong{display:block;color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}.offload-note{color:var(--muted);font-size:10px;margin-top:5px;line-height:1.35}
  @media (max-width:700px){.cargo-loader-title{font-size:22px}.cargo-loader-track{height:104px}.cargo-loader-runner,.cargo-loader-runner img{width:70px;height:70px}.cargo-loader-runner{margin-left:-35px}.action-loader-card{padding:18px 16px 16px}.action-loader-runner img{width:68px;height:68px}}
  @media (prefers-reduced-motion:reduce){.cargo-loader-runner,.cargo-loader-speed,.action-loader-runner img,.cargo-loader-dots i{animation:none}}
  .verified{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.35px;color:#baf7df;background:rgba(54,211,153,.10);border:1px solid rgba(54,211,153,.22)}
  .modal-head{display:flex;align-items:center;gap:13px;margin-bottom:8px}
  .modal-mascot-frame{width:62px;height:62px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .modal-mascot-frame img{width:100%;height:100%;object-fit:contain;object-position:center;transform:none;filter:drop-shadow(0 10px 22px rgba(0,0,0,.22))}
  .modal-head h2{margin:0;font-size:24px}
  .accept-note{margin-top:8px;padding:9px 11px;border-radius:10px;background:rgba(113,197,255,.08);border:1px solid rgba(113,197,255,.18);color:#d8f0ff;font-size:12px;line-height:1.4}

  .nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .nav-pill{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}
  .nav-pill:hover{background:rgba(255,255,255,.10)}
  .mascot-mini{width:28px;height:28px;object-fit:contain;object-position:center;border:none;background:none;border-radius:0;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18))}
  .dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 20px}
  .kpi{background:rgba(4,58,87,.86);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:900}
  .kpi .value{font-size:31px;line-height:1;margin:8px 0 4px;font-weight:950}
  .kpi .hint{font-size:12px;color:var(--muted)}
  .kpi.danger-kpi .value{color:var(--red)}
  .kpi.warn-kpi .value{color:var(--amber)}
  .kpi.good-kpi .value{color:var(--green)}
  .dash-columns{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}
  .panel{background:rgba(4,58,87,.86);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
  .panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
  .panel-title h3{margin:0;font-size:18px}
  .panel-title span{font-size:11px;color:var(--muted);font-weight:800}
  .ops-progress{margin:14px 0}
  .ops-progress-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;margin-bottom:7px}
  .ops-progress-head small{color:var(--muted);font-weight:700}
  .alert-list,.activity-list,.history-list{display:flex;flex-direction:column;gap:8px}
  .alert-item,.activity-item,.history-item{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:13px;padding:12px;display:grid;gap:10px;align-items:center}
  .alert-item{grid-template-columns:auto 1fr auto;cursor:pointer}
  .alert-item:hover{background:rgba(255,255,255,.07)}
  .severity{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(255,200,87,.09)}
  .severity.red{background:var(--red);box-shadow:0 0 0 4px rgba(255,107,107,.09)}
  .severity.green{background:var(--green);box-shadow:0 0 0 4px rgba(54,211,153,.09)}
  .alert-main strong{display:block;font-size:14px;margin-bottom:3px}
  .alert-main small{color:var(--muted);line-height:1.35}
  .alert-age{font-size:11px;color:var(--muted);font-weight:900;white-space:nowrap}
  .supervisor-hero{display:grid;grid-template-columns:1fr 170px;gap:16px;align-items:center;padding:18px;background:linear-gradient(145deg,rgba(4,58,87,.92),rgba(4,48,74,.92));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .supervisor-hero h2{margin:0 0 7px;font-size:27px}
  .supervisor-hero p{margin:0;color:var(--muted);line-height:1.45;font-size:13px}
  .supervisor-hero img{width:100%;display:block;filter:drop-shadow(0 16px 30px rgba(0,0,0,.18))}
  .history-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .history-controls input{flex:1;min-width:220px;border-radius:12px;border:1px solid rgba(255,255,255,.17);background:#052f49;color:white;padding:11px 13px;outline:none}
  .filter-btn{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:white;background:rgba(255,255,255,.05);font-weight:800;font-size:11px}
  .filter-btn.active{background:#0b6d96;border-color:#1284b3}
  .history-item{grid-template-columns:92px 1fr 145px}
  .history-time{font-size:11px;color:var(--muted);font-weight:800;line-height:1.35}
  .history-main strong{display:block;font-size:14px;margin-bottom:3px}
  .history-main small{color:var(--muted);line-height:1.4}
  .event-type{justify-self:end;font-size:10px;text-transform:uppercase;letter-spacing:.65px;font-weight:900;padding:5px 8px;border-radius:999px;border:1px solid rgba(113,197,255,.25);background:rgba(113,197,255,.10);color:#cdeeff}
  .event-type.offload{border-color:rgba(255,200,87,.28);background:rgba(255,200,87,.10);color:#ffe7a8}
  .event-type.flight{border-color:rgba(54,211,153,.28);background:rgba(54,211,153,.10);color:#baf7df}
  .event-type.ffm{border-color:rgba(199,146,234,.28);background:rgba(199,146,234,.10);color:#eed8ff}
  .mascot-empty{width:120px;margin:0 auto 12px;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.18))}
  .activity-item{grid-template-columns:1fr auto}
  .activity-item strong{font-size:13px;display:block;margin-bottom:3px}.activity-item small{color:var(--muted);font-size:11px}.activity-item time{color:var(--muted);font-size:10px;font-weight:800}
  .manager-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);font-size:11px;font-weight:900;margin-bottom:10px}
  
  .brand{gap:12px}.brand span{font-size:24px}

  /* ===== Step 5F Supervisor Wallboard ===== */
  .supervisor-wallboard-shell{display:flex;flex-direction:column;gap:14px}
  .supervisor-live-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(4,58,87,.96),rgba(5,46,71,.96));box-shadow:var(--shadow)}
  .supervisor-live-head.red{border-color:rgba(255,107,107,.65);box-shadow:0 0 0 1px rgba(255,107,107,.12),0 18px 40px rgba(0,0,0,.18)}
  .supervisor-live-head.amber{border-color:rgba(255,200,87,.55)}
  .supervisor-live-head.green{border-color:rgba(54,211,153,.35)}
  .supervisor-live-head h1{margin:5px 0 4px;font-size:30px;line-height:1.1}
  .supervisor-live-head p{margin:0;color:var(--muted);font-size:13px}
  .supervisor-live-clock{text-align:right;min-width:110px}
  .supervisor-live-clock span{display:block;font-size:9px;font-weight:900;letter-spacing:1px;color:var(--muted)}
  .supervisor-live-clock strong{font-size:30px;letter-spacing:.5px}
  .supervisor-daily-grid{display:grid;grid-template-columns:1.3fr 1.3fr .8fr .8fr;gap:10px}
  .supervisor-daily-card{background:rgba(4,58,87,.9);border:1px solid var(--line);border-radius:16px;padding:15px 16px;min-height:112px}
  .supervisor-daily-card>span{display:block;font-size:9px;font-weight:950;letter-spacing:.85px;color:var(--muted)}
  .supervisor-daily-card>strong{display:block;font-size:30px;margin:5px 0 7px}
  .supervisor-daily-card>strong small{font-size:15px;color:var(--muted);font-weight:800}
  .supervisor-daily-card p{margin:7px 0 0;font-size:11px;color:var(--muted)}
  .supervisor-daily-card.compact>strong{font-size:34px}
  .red-text{color:var(--red)!important}.amber-text{color:var(--amber)!important}
  .supervisor-board-panel{background:rgba(4,58,87,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
  .supervisor-board-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
  .supervisor-board-title h2{margin:2px 0 4px;font-size:21px}
  .supervisor-board-title p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}
  .supervisor-board-title>span{font-size:9px;font-weight:950;letter-spacing:.8px;color:var(--muted);white-space:nowrap}
  .wall-eyebrow{font-size:9px;font-weight:950;letter-spacing:1px;color:#8dd7ff}
  .supervisor-export-list,.supervisor-mail-list,.supervisor-other-list{display:flex;flex-direction:column;gap:8px}
  .supervisor-export-row{display:grid;grid-template-columns:minmax(180px,1.1fr) 110px minmax(180px,1.1fr) minmax(190px,1fr) auto;align-items:center;gap:14px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}
  .supervisor-export-row.red{border-color:rgba(255,107,107,.7);background:linear-gradient(90deg,rgba(255,107,107,.11),rgba(255,255,255,.025) 36%)}
  .supervisor-export-row.amber{border-color:rgba(255,200,87,.55);background:linear-gradient(90deg,rgba(255,200,87,.08),rgba(255,255,255,.025) 36%)}
  .supervisor-export-row.green{border-color:rgba(54,211,153,.25)}
  .supervisor-export-row.neutral{border-style:dashed}
  .supervisor-flight-id{display:flex;align-items:center;gap:10px;min-width:0}
  .supervisor-flight-id>div:last-child{min-width:0}
  .supervisor-flight-id strong{display:block;font-size:17px}
  .supervisor-flight-id small{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .supervisor-time-block span,.supervisor-mail-row>div>span{display:block;font-size:8px;font-weight:950;letter-spacing:.7px;color:var(--muted)}
  .supervisor-time-block strong{display:block;font-size:18px;margin:2px 0}
  .supervisor-time-block small{display:block;color:var(--muted);font-size:9px}
  .supervisor-flight-progress>div:first-child{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin-bottom:6px}
  .supervisor-flight-progress>div:first-child span{color:var(--muted)}
  .supervisor-sla-callout{display:flex;flex-direction:column;gap:5px}
  .supervisor-sla-callout>strong{font-size:11px;line-height:1.3}
  .sla-chip{display:inline-flex;align-items:center;width:max-content;max-width:100%;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:950;letter-spacing:.7px;border:1px solid var(--line)}
  .sla-chip.red{color:#ffd4d4;background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.45)}
  .sla-chip.amber{color:#ffe59f;background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.4)}
  .sla-chip.green{color:#baf7df;background:rgba(54,211,153,.1);border-color:rgba(54,211,153,.28)}
  .sla-chip.neutral{color:#d5e8f2;background:rgba(255,255,255,.05)}
  .supervisor-row-actions{display:flex;gap:6px;justify-content:flex-end}
  .supervisor-row-actions button{white-space:nowrap}
  .supervisor-lower-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}
  .supervisor-mail-row{display:grid;grid-template-columns:minmax(170px,1.2fr) 90px 90px minmax(170px,1fr) auto;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}
  .supervisor-mail-row.red{border-color:rgba(255,107,107,.65);background:rgba(255,107,107,.08)}
  .supervisor-mail-row.amber{border-color:rgba(255,200,87,.48);background:rgba(255,200,87,.06)}
  .supervisor-mail-row.green{border-color:rgba(54,211,153,.24)}
  .supervisor-mail-row>div:first-child strong{display:block;font-size:13px}
  .supervisor-mail-row>div:first-child small{display:block;color:var(--muted);margin-top:2px;font-size:9px}
  .supervisor-mail-row>div>strong{font-size:12px}
  .mail-status{display:flex;flex-direction:column;gap:4px}
  .mail-status>strong{font-size:10px!important}
  .supervisor-other-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);color:#fff}
  .supervisor-other-row div strong{display:block;font-size:11px}
  .supervisor-other-row div small{display:block;color:var(--muted);margin-top:2px;font-size:9px;line-height:1.3}
  .supervisor-other-row>b{font-size:9px;color:var(--muted)}
  .wallboard-exit{display:none}
  .supervisor-wallboard-mode .topbar,.supervisor-wallboard-mode .supervisor-toolbar,.supervisor-wallboard-mode .floating-scan,.supervisor-wallboard-mode .footer-note{display:none!important}
  .supervisor-wallboard-mode .shell{width:min(1600px,100%);padding:12px 16px 18px}
  .supervisor-wallboard-mode .supervisor-wallboard-shell{gap:10px}
  .supervisor-wallboard-mode .supervisor-live-head{padding:15px 18px}
  .supervisor-wallboard-mode .supervisor-live-head h1{font-size:28px}
  .supervisor-wallboard-mode .supervisor-board-panel{padding:13px}
  .supervisor-wallboard-mode .wallboard-exit{display:block;position:fixed;right:12px;bottom:12px;z-index:300;border:1px solid var(--line);background:#073c5b;color:white;border-radius:999px;padding:8px 12px;font-weight:900;font-size:10px}
  @media (max-width:1050px){
    .supervisor-daily-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .supervisor-export-row{grid-template-columns:1fr 100px 1fr}
    .supervisor-export-row .supervisor-sla-callout{grid-column:1/3}
    .supervisor-export-row .supervisor-row-actions{grid-column:3;grid-row:2}
    .supervisor-lower-grid{grid-template-columns:1fr}
    .supervisor-mail-row{grid-template-columns:1.2fr 90px 90px 1fr auto}
  }
  @media (max-width:700px){
    .supervisor-live-head,.supervisor-daily-grid,.supervisor-board-panel{display:none}
    .supervisor-mobile-red{border:1px solid rgba(255,107,107,.5)!important}
    .supervisor-mobile-amber{border:1px solid rgba(255,200,87,.45)!important}
    .supervisor-mobile-row.red{border-color:rgba(255,107,107,.55)}
    .supervisor-mobile-row.amber{border-color:rgba(255,200,87,.45)}
  }

let cargoLoaderDepth=0;
function showDataLoader(title='Loading live operations…',sub='Connecting to CargoRun'){
 const el=document.getElementById('cargoLoader');
 if(!el)return;
 cargoLoaderDepth++;
 const img=document.getElementById('cargoLoaderMascot');
 if(img&&!img.src)img.src=CARGORUN_MASCOT;
 const t=document.getElementById('cargoLoaderTitle'),s=document.getElementById('cargoLoaderSub');
 if(t)t.textContent=title;
 if(s)s.textContent=sub;
 el.classList.add('show');
 document.body.setAttribute('aria-busy','true');
}
function updateDataLoader(title,sub){
 const t=document.getElementById('cargoLoaderTitle'),s=document.getElementById('cargoLoaderSub');
 if(title&&t)t.textContent=title;
 if(sub&&s)s.textContent=sub;
}
function hideDataLoader(force=false){
 const el=document.getElementById('cargoLoader');
 if(!el)return;
 cargoLoaderDepth=force?0:Math.max(0,cargoLoaderDepth-1);
 if(cargoLoaderDepth===0){el.classList.remove('show');document.body.removeAttribute('aria-busy')}
}

const EXPORT_STATUSES=['Warehouse','Transit','At Aircraft'];
const CARGORUN_STATE_VERSION=7;
const seed={
 stateVersion:CARGORUN_STATE_VERSION,
 sessionUser:{name:'Signing in…',employeeId:'',roles:[],identityProvider:''},
 settings:{flightStatus:{endpoint:'/api/flight-status',arrivalAirport:'MEL',pollMinutes:2,landingGraceMinutes:10,standardWarnMinutes:20,standardLateMinutes:30,priorityWarnMinutes:10,priorityLateMinutes:20}},
 imports:[],
 exports:[],
 offloads:[],
 completedOffloads:[],
 completedExports:[],
 completedImports:[],
 history:[]
};
let state=loadState();
let route={screen:'home',type:null,id:null};
let historyFilter='All';
let historySearch='';
let historyOpenDays=new Set();
function loadState(){
 try{
  const raw=JSON.parse(localStorage.getItem('cargorun-state')||'null');
  if(!raw||raw.stateVersion!==CARGORUN_STATE_VERSION)return structuredClone(seed);
  const s={...structuredClone(seed),...raw};
  s.stateVersion=CARGORUN_STATE_VERSION;
  if(!s.sessionUser)s.sessionUser={name:'Signing in…',employeeId:'',roles:[],identityProvider:''};
  s.settings=s.settings||{};
  s.settings.flightStatus={...structuredClone(seed.settings.flightStatus),...(s.settings.flightStatus||{})};
  for(const k of ['imports','exports','offloads','completedOffloads','completedExports','completedImports','history'])if(!Array.isArray(s[k]))s[k]=[];
  return s;
 }catch(e){return structuredClone(seed)}
}
function save(){state.stateVersion=CARGORUN_STATE_VERSION;localStorage.setItem('cargorun-state',JSON.stringify(state))}

function canUseCargoRunApi(){
  return location.protocol==='http:'||location.protocol==='https:';
}

function azureDateOnly(value=''){
  const raw=String(value||'').trim();
  const m=raw.match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:'';
}

function azureDisplayDate(value=''){
  const iso=azureDateOnly(value);
  if(!iso)return '';
  const [y,m,d]=iso.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${Number(d)} ${months[Math.max(0,Number(m)-1)]||m} ${y}`;
}

function azureStatusToUi(status,direction){
  const s=String(status||'').trim().toUpperCase().replace(/[_-]+/g,' ');
  const map={
    'UNARRIVED':'Unarrived',
    'ARRIVED':'Arrived',
    'TRANSIT':'Transit',
    'RECEIVED':'Received',
    'WAREHOUSE':'Warehouse',
    'AT AIRCRAFT':'At Aircraft',
    'REQUESTED':'Requested',
    'COMPLETE':'Complete'
  };
  return map[s]||(String(direction||'').toUpperCase()==='EXPORT'?'Warehouse':'Unarrived');
}

function uiStatusToAzure(status){
  return String(status||'').trim().toUpperCase().replace(/[\s-]+/g,'_');
}

function apiField(obj,names){
  for(const name of names){
    if(obj&&obj[name]!==undefined&&obj[name]!==null&&obj[name]!=='')return obj[name];
  }
  return null;
}

function azureShcs(value){
  if(Array.isArray(value))return value.map(x=>String(x).trim().toUpperCase()).filter(Boolean);
  return String(value||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
}

function sameAzureFlight(localFlight,apiFlight){
  if(!localFlight||!apiFlight)return false;
  if(localFlight.azureFlightId!=null&&String(localFlight.azureFlightId)===String(apiFlight.FlightId))return true;
  if(String(localFlight.flight||'').toUpperCase()!==String(apiFlight.FlightNumber||'').toUpperCase())return false;
  const azureDate=azureDateOnly(apiFlight.OperatingDate);
  if(!azureDate)return true;
  const localRaw=String(localFlight.flightDate||'').trim();
  if(!localRaw)return true;
  try{return flightDateISO(localFlight)===azureDate}catch{return true}
}

function azureFlightStatus(existing,apiFlight){
  const current={...(existing?.flightStatus||{})};
  const fields=[
    ['scheduledArrival','ScheduledArrivalUtc'],
    ['estimatedArrival','EstimatedArrivalUtc'],
    ['landedAt','LandedAtUtc'],
    ['inBlockAt','InBlockAtUtc'],
    ['scheduledDeparture','ScheduledDepartureUtc'],
    ['estimatedDeparture','EstimatedDepartureUtc']
  ];
  let hasAzureArrival=false;
  for(const [target,source] of fields){
    if(apiFlight[source]){
      current[target]=apiFlight[source];
      hasAzureArrival=true;
    }
  }
  if(hasAzureArrival){
    current.provider='Azure SQL';
    current.source='azure-sql';
    current.lastChecked=Date.now();
  }
  return current;
}

function azureUldToUi(apiUld,direction,existingUld=null){
  const status=azureStatusToUi(apiUld.CurrentStatus,direction);
  const initial=String(direction||'').toUpperCase()==='EXPORT'?'Warehouse':'Unarrived';
  const acceptedAt=apiField(apiUld,['AcceptedAtUtc','AcceptedAt']);
  const receivedAt=apiField(apiUld,['ReceivedAtUtc','ReceivedAt']);
  const departedAt=apiField(apiUld,['WarehouseDepartedAtUtc','WarehouseDepartedAt','DepartedWarehouseAtUtc']);
  const atAircraftAt=apiField(apiUld,['AtAircraftAtUtc','AtAircraftAt']);
  const acceptedBy=apiField(apiUld,['AcceptedByDisplayName','AcceptedByName']);
  const receivedBy=apiField(apiUld,['ReceivedByDisplayName','ReceivedByName']);
  const departedBy=apiField(apiUld,['WarehouseDepartedByDisplayName','WarehouseDepartedByName','DepartedWarehouseByDisplayName']);
  const deliveredBy=apiField(apiUld,['AtAircraftByDisplayName','AtAircraftByName','DeliveredByDisplayName']);
  return {
    ...(existingUld||{}),
    azureUldId:apiUld.UldId,
    num:String(apiUld.UldNumber||'').trim().toUpperCase(),
    shcs:azureShcs(apiUld.SHCs),

function priorityCargoItems(){const out=[];const type='imports';for(const f of activeFlights('imports'))for(let i=0;i<f.ulds.length;i++){const u=f.ulds[i],tags=priorityTagsFor(f,u,type);if(!tags.length||u.status==='Received')continue;const critical=tags.some(t=>t.level==='critical');out.push({type,flightId:f.id,flight:f.flight,uld:u.num,status:u.status,tags,handlingType:u.handlingType||'',weight:u.weight||null,level:critical?'critical':'priority',rank:critical?0:1})}return out.sort((a,b)=>a.rank-b.rank||a.flight.localeCompare(b.flight))}
function priorityCargoScreen(){if(isMobileUI())return mobilePriorityScreen();const items=priorityCargoItems(),critical=items.filter(x=>x.level==='critical').length,priority=items.length-critical;return `<div class="toolbar"><button class="back" onclick="openScreen('home')">← Home</button><div class="spacer"></div><button class="secondary" onclick="openScreen('flightboard')">Live Flight Board</button><button class="primary" onclick="showScan()">Scan ULD</button></div><div class="screen-intro"><div><div class="screen-title">Inbound Priority Cargo</div><div class="screen-sub">Only operational priority categories are shown here: live animals, temperature-controlled/pharma cargo, priority mail for CX/UA, AOG, valuable cargo and human remains. Non-priority SHCs remain in the source data but are hidden from the operational view.</div><div class="ops-strip">${opsChip('Immediate',critical,critical?'red':'green')}${opsChip('Priority',priority,priority?'amber':'green')}${opsChip('Inbound total',items.length,items.length?'amber':'green')}</div></div><img class="mascot-mini" style="width:64px;height:64px" src="${CARGORUN_MASCOT}" alt="CargoRun mascot"></div><div class="priority-grid">${items.length?items.map(x=>`<div class="priority-row ${x.level}" onclick="openScreen('flight','imports','${x.flightId}')"><div class="priority-level ${x.level}">${x.level==='critical'?'Immediate':'Priority'}</div><div class="priority-main"><strong>${esc(x.uld)}</strong><small>Inbound cargo${x.handlingType?` • ${esc(x.handlingType)}`:''}${x.weight?` • ${esc(formatWeight(x.weight))}`:''}</small></div><div class="priority-shcs">${priorityBadges(x.tags)}</div><div class="priority-flight">${airlineBadge(x.flight)}<div><strong>${esc(x.flight)}</strong><div class="priority-direction">IMPORT • TO WAREHOUSE</div></div></div><div class="priority-status">${esc(x.status)}<small>Open import flight</small></div></div>`).join(''):`<div class="empty"><img class="mascot-empty" src="${CARGORUN_MASCOT}" alt="CargoRun mascot">No outstanding inbound priority cargo.</div>`}</div>`}
function handlingCounts(f){return {intact:f.ulds.filter(u=>u.handlingType==='INTACT').length,breakdown:f.ulds.filter(u=>u.handlingType==='BREAKDOWN').length}}
function ageMinutes(ts){return Math.max(0,Math.floor((Date.now()-ts)/60000))}
function flightStatusSettings(){return state.settings?.flightStatus||seed.settings.flightStatus}
function toMs(v){if(!v)return null;if(typeof v==='number')return v>1e12?v:v*1000;const n=Date.parse(v);return Number.isFinite(n)?n:null}
function flightDateISO(f){const raw=String(f?.flightDate||'').trim();if(!raw)return new Date().toISOString().slice(0,10);let m;if((m=raw.match(/(\d{1,2})[-\/]([A-Za-z]{3}|\d{1,2})[-\/](\d{4})/))){const d=Number(m[1]),y=Number(m[3]);const months={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};const mon=/^[A-Za-z]/.test(m[2])?months[m[2].slice(0,3).toUpperCase()]:Number(m[2])-1;if(Number.isFinite(mon))return `${y}-${String(mon+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}if((m=raw.match(/(\d{1,2})([A-Za-z]{3})(\d{4})/))){const months={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};return `${m[3]}-${months[m[2].toUpperCase()]||'01'}-${String(m[1]).padStart(2,'0')}`;}const parsed=Date.parse(raw);return Number.isFinite(parsed)?new Date(parsed).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}
function arrivalTimerStart(f){const fs=f?.flightStatus||{};const inBlock=toMs(fs.inBlockAt||fs.actualIn);if(inBlock)return {ts:inBlock,basis:'In block'};const landed=toMs(fs.landedAt||fs.actualOn);if(landed){const grace=Number(flightStatusSettings().landingGraceMinutes||0);return {ts:landed+grace*60000,basis:`Landed + ${grace}m grace`}}return null}
function acceptanceThresholds(f,u){const s=flightStatusSettings(),priority=uldPriorityClass(f,u,'imports')!=='standard';return priority?{warn:Number(s.priorityWarnMinutes),late:Number(s.priorityLateMinutes),priority:true}:{warn:Number(s.standardWarnMinutes),late:Number(s.standardLateMinutes),priority:false}}
function acceptanceSla(f,u){const start=arrivalTimerStart(f);if(!start)return {level:'none',minutes:null,start:null,basis:''};const end=u.acceptedAt?toMs(u.acceptedAt):Date.now();const minutes=Math.max(0,Math.floor((end-start.ts)/60000));const t=acceptanceThresholds(f,u);let level='ok';if(!u.acceptedAt&&minutes>=t.late)level='late';else if(!u.acceptedAt&&minutes>=t.warn)level='warn';return {level,minutes,start:start.ts,basis:start.basis,priority:t.priority,accepted:!!u.acceptedAt}}
function flightAcceptanceSummary(f){let late=0,warn=0;for(const u of f.ulds||[]){if(u.status!=='Unarrived')continue;const s=acceptanceSla(f,u);if(s.level==='late')late++;else if(s.level==='warn')warn++;}return {late,warn,total:late+warn}}
function acceptanceBadge(f,u){if(u.status!=='Unarrived'&&!u.acceptedAt)return '';const s=acceptanceSla(f,u);if(s.minutes===null)return '';if(u.acceptedAt)return `<span class="acceptance-age ok">Accepted ${s.minutes}m after arrival</span>`;if(s.level==='late')return `<span class="acceptance-age late">Acceptance late • ${s.minutes}m</span>`;if(s.level==='warn')return `<span class="acceptance-age warn">Acceptance warning • ${s.minutes}m</span>`;return `<span class="acceptance-age ok">Acceptance timer • ${s.minutes}m</span>`}
function arrivalSummaryHtml(f){const fs=f.flightStatus||{},start=arrivalTimerStart(f),sla=flightAcceptanceSummary(f);let label='Arrival not synced',cls='offline';if(toMs(fs.inBlockAt||fs.actualIn)){label=`In block ${fmtTime(toMs(fs.inBlockAt||fs.actualIn))}`;cls=sla.late?'late':sla.warn?'warn':'live'}else if(toMs(fs.landedAt||fs.actualOn)){label=`Landed ${fmtTime(toMs(fs.landedAt||fs.actualOn))}`;cls=sla.late?'late':sla.warn?'warn':'live'}else if(toMs(fs.estimatedArrival)){label=`ETA ${fmtTime(toMs(fs.estimatedArrival))}`;cls='offline'}return `<div class="arrival-line"><span class="arrival-pill ${cls}">${esc(label)}</span>${start?`<span>${Math.max(0,ageMinutes(start.ts))}m since timer start</span>`:''}${fs.provider?`<span>${esc(fs.provider)}</span>`:''}</div>`}
function localDateTimeValue(ts=Date.now()){const d=new Date(ts),off=d.getTimezoneOffset()*60000;return new Date(d.getTime()-off).toISOString().slice(0,16)}
function canUseFlightStatusApi(){return location.protocol==='http:'||location.protocol==='https:'}
async function syncFlightArrivalById(id,quiet=false){const f=state.imports.find(x=>x.id===id);if(!f||f.closed)return false;const s=flightStatusSettings();if(!canUseFlightStatusApi()){if(!quiet)toast('Live arrival sync activates once CargoRun is hosted in Azure. Manual In Block works now.');return false}try{const qs=new URLSearchParams({flight:f.flight,arrivalAirport:s.arrivalAirport||'MEL',date:flightDateISO(f)});const res=await fetch(`${s.endpoint||'/api/flight-status'}?${qs}`,{headers:{Accept:'application/json'}});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||`Flight status ${res.status}`);f.flightStatus={...(f.flightStatus||{}),provider:data.provider||'FlightAware AeroAPI',status:data.status||'',scheduledArrival:data.scheduledArrival||null,estimatedArrival:data.estimatedArrival||null,landedAt:data.landedAt||null,inBlockAt:data.inBlockAt||null,lastChecked:Date.now(),matchedFlight:data.matchedFlight||f.flight,source:'azure'};logEvent('Flight','Arrival status synced',{flight:f.flight,detail:`${f.flightStatus.inBlockAt?'In block '+fmtDateTime(toMs(f.flightStatus.inBlockAt)):f.flightStatus.landedAt?'Landed '+fmtDateTime(toMs(f.flightStatus.landedAt)):'Flight status updated'}`,user:'CargoRun'});save();if(!quiet){toast(`${f.flight} arrival status updated`);render()}return true}catch(err){f.flightStatus={...(f.flightStatus||{}),lastChecked:Date.now(),lastError:err.message||'Flight status unavailable'};save();if(!quiet)toast(`${f.flight}: ${err.message||'flight status unavailable'}`);return false}}
async function syncAllFlightArrivals(quiet=false){const flights=activeFlights('imports');if(!flights.length)return;let ok=0;for(const f of flights){if(await syncFlightArrivalById(f.id,true))ok++}if(!quiet){toast(ok?`Arrival status updated for ${ok}/${flights.length} import flights`:'No live arrival statuses updated');render()}}
function showSetInBlock(id){const f=state.imports.find(x=>x.id===id);if(!f)return;modal(`${modalHead('Set Aircraft In Block')}<p>Fallback for when the external flight-status feed is unavailable. This time starts CargoRun's ULD acceptance timers.</p><div class="field"><label>IN BLOCK TIME</label><input id="manualInBlock" type="datetime-local" value="${localDateTimeValue()}"></div><div class="accept-note">The record will show that the time was manually entered and who entered it.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveManualInBlock('${id}')">Start Timers</button></div>`)}
function saveManualInBlock(id){const f=state.imports.find(x=>x.id===id),v=document.getElementById('manualInBlock')?.value;if(!f||!v)return;const ts=new Date(v).getTime();if(!Number.isFinite(ts)){toast('Enter a valid time');return}f.flightStatus={...(f.flightStatus||{}),provider:'Manual',inBlockAt:new Date(ts).toISOString(),landedAt:f.flightStatus?.landedAt||null,lastChecked:Date.now(),source:'manual',manualBy:currentUser().name};logEvent('Flight','In block set manually',{flight:f.flight,detail:`In block ${fmtDateTime(ts)}`,user:currentUser().name});save();closeModal();toast(`${f.flight} acceptance timers started`);render()}
function showFlightStatusSettings(){const s=flightStatusSettings();modal(`${modalHead('Flight Arrival Integration')}<p>CargoRun calls an Azure Function at <strong>${esc(s.endpoint)}</strong>. The Azure Function keeps the FlightAware API key server-side and returns scheduled, estimated, landed and in-block times.</p><div class="integration-card"><strong>${canUseFlightStatusApi()?'Azure-hosted mode available':'Local prototype mode'}</strong><small>${canUseFlightStatusApi()?'Use Sync Arrivals to query the configured Azure endpoint.':'Open this version locally for UI testing. Live API calls begin after Azure deployment; use manual In Block timestamps in the meantime.'}</small></div><div class="field"><label>STANDARD WARNING / LATE (MIN)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="stdWarn" type="number" min="1" value="${s.standardWarnMinutes}"><input id="stdLate" type="number" min="1" value="${s.standardLateMinutes}"></div></div><div class="field"><label>PRIORITY WARNING / LATE (MIN)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="priWarn" type="number" min="1" value="${s.priorityWarnMinutes}"><input id="priLate" type="number" min="1" value="${s.priorityLateMinutes}"></div></div><div class="field"><label>LANDING-TO-IN-BLOCK FALLBACK GRACE (MIN)</label><input id="landGrace" type="number" min="0" value="${s.landingGraceMinutes}"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveFlightStatusSettings()">Save</button></div>`)}
function saveFlightStatusSettings(){const s=flightStatusSettings();s.standardWarnMinutes=Math.max(1,Number(document.getElementById('stdWarn').value)||20);s.standardLateMinutes=Math.max(s.standardWarnMinutes,Number(document.getElementById('stdLate').value)||30);s.priorityWarnMinutes=Math.max(1,Number(document.getElementById('priWarn').value)||10);s.priorityLateMinutes=Math.max(s.priorityWarnMinutes,Number(document.getElementById('priLate').value)||20);s.landingGraceMinutes=Math.max(0,Number(document.getElementById('landGrace').value)||0);state.settings.flightStatus=s;save();closeModal();toast('Arrival warning settings saved');render()}

function toneClass(level){return level==='red'?'alert':level==='amber'?'warn':'good'}
function statusPill(label,level){return `<span class="state-badge ${toneClass(level)}">${esc(label)}</span>`}
function opsChip(label,num,level){return `<span class="ops-chip ${level}">${esc(label)} <span class="num">${num}</span></span>`}
function importsUrgencySummary(){
 const flights=activeFlights('imports');
 let red=0, amber=0;
 flights.forEach(f=>{const pending=f.ulds.filter(u=>u.status!=='Received'),sla=flightAcceptanceSummary(f);const high=pending.some(u=>uldPriorityClass(f,u,'imports')==='critical'),priority=pending.some(u=>uldPriorityClass(f,u,'imports')==='priority');if(sla.late||high)red++;else if(sla.warn||priority||pending.filter(u=>u.status==='Unarrived').length>=2)amber++;else if(pending.length)amber++;});
 return red?{level:'red',cls:'alert',label:'Urgent',detail:`${red} import flight${red===1?'':'s'} need attention`}:amber?{level:'amber',cls:'warn',label:'Watch',detail:`${amber} import flight${amber===1?'':'s'} in progress`}:{level:'green',cls:'good',label:'Clear',detail:'All active imports under control'};
}
function exportsUrgencySummary(){
 const flights=activeFlights('exports');
 let amber=flights.filter(f=>f.ulds.some(u=>u.status!=='At Aircraft')).length;
 return amber?{level:'amber',cls:'warn',label:'Active',detail:`${amber} export flight${amber===1?'':'s'} still loading`}:{level:'green',cls:'good',label:'Clear',detail:'No export issues'};
}
function offloadUrgencySummary(){
 const critical=state.offloads.filter(o=>ageMinutes(o.requestedAt)>=10).length;
 if(critical)return {level:'red',cls:'alert',label:'Urgent',detail:`${critical} offload${critical===1?'':'s'} waiting >10 min`};
 if(state.offloads.length)return {level:'amber',cls:'warn',label:'Active',detail:`${state.offloads.length} offload${state.offloads.length===1?'':'s'} outstanding`};
 return {level:'green',cls:'good',label:'Clear',detail:'No outstanding offloads'};
}
function overallUrgencySummary(){
 const alerts=supervisorAlerts(); const critical=alerts.filter(a=>a.level==='red').length; const amber=alerts.length-critical;
 if(critical)return {level:'red',cls:'alert',label:'Critical',text:`${critical} critical item${critical===1?'':'s'} need attention`,critical,amber};
 if(amber)return {level:'amber',cls:'warn',label:'Watch',text:`${amber} operational item${amber===1?'':'s'} to watch`,critical,amber};
 return {level:'green',cls:'good',label:'Clear',text:'Operation is clear',critical:0,amber:0};
}

function allActiveUlds(){return [...activeFlights('imports').flatMap(f=>f.ulds.map(u=>({...u,flight:f.flight,type:'imports',flightId:f.id}))),...activeFlights('exports').flatMap(f=>f.ulds.map(u=>({...u,flight:f.flight,type:'exports',flightId:f.id})))]}
function recentEvents(n=6){return (state.history||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,n)}
function eventDescription(e){let bits=[];if(e.flight)bits.push(e.flight);if(e.uld)bits.push(e.uld);let context=bits.join(' • ');let change=e.from&&e.to?`${e.from} → ${e.to}`:'';return [context,change,e.detail].filter(Boolean).join(' — ')}
function activityRows(events){return events.length?events.map(e=>`<div class="activity-item"><div><strong>${esc(e.action)}</strong><small>${esc(eventDescription(e)||e.type)}</small></div><time>${fmtTime(e.ts)}</time></div>`).join(''):`<div class="empty">No activity recorded yet.</div>`}
function supervisorAlerts(){const alerts=[];activeFlights('imports').forEach(f=>f.ulds.forEach((u,i)=>{const sla=acceptanceSla(f,u),pclass=uldPriorityClass(f,u,'imports'),priorityText=prioritySummaryText(f,u,'imports');if(u.status==='Unarrived'){let level=pclass==='critical'?'red':'amber';let detail=`ULD still unarrived${priorityText?` • ${priorityText}`:''}`;if(sla.level==='late'){level='red';detail+=` • acceptance ${sla.minutes}m`;}else if(sla.level==='warn'){level='amber';detail+=` • acceptance ${sla.minutes}m`;}alerts.push({level,title:`${f.flight} • ${u.num}`,detail,action:`openScreen('flight','imports','${f.id}')`,age:sla.minutes!==null?`${sla.minutes}m`:''});}else if(u.status!=='Received'&&pclass!=='standard')alerts.push({level:pclass==='critical'?'red':'amber',title:`${f.flight} • ${u.num}`,detail:`Priority cargo currently ${u.status}${priorityText?` • ${priorityText}`:''}`,action:`openScreen('flight','imports','${f.id}')`,age:''})}));state.offloads.forEach(o=>{const mins=ageMinutes(o.requestedAt),instruction=o.requestInstruction?` • ${o.requestInstruction}`:'';if(mins>=10)alerts.push({level:'red',title:`Offload ${o.uld}`,detail:`${o.flight} • Bay ${o.bay} • ${o.status}${instruction}`,action:`openScreen('offloads')`,age:`${mins}m`});else alerts.push({level:'amber',title:`Offload ${o.uld}`,detail:`${o.flight} • Bay ${o.bay} • ${o.status}${instruction}`,action:`openScreen('offloads')`,age:`${mins}m`})});return alerts}


function mobileFlightCard(f,type){const c=counts(f,type),p=pct(c.done,c.total),m=airlineMeta(f.flight),st=flightBoardState(f,type),hc=handlingCounts(f),tags=flightPriorityTags(f,type).slice(0,4);const meta=type==='imports'?`${c.done}/${c.total} received${hc.intact||hc.breakdown?` • ${hc.intact} intact • ${hc.breakdown} breakdown`:''}`:`${c.done}/${c.total} at aircraft`;return `<button class="mobile-flight-card ${st.cls}" onclick="openScreen('flight','${type}','${f.id}')"><div class="mobile-flight-top">${airlineBadge(f.flight)}<div class="mobile-flight-main"><strong>${esc(f.flight)}</strong><small>${esc(type==='imports'?'Import • To warehouse':'Export • To aircraft')}${type==='imports'?` • ${esc(mobileArrivalLabel(f))}`:''}</small></div><span class="mobile-flight-status ${st.level}">${esc(st.label)}</span></div><div class="mobile-flight-meta"><span>${esc(meta)}</span><span>${p}%</span></div><div class="progress mobile-flight-progress"><span style="width:${p}%"></span></div>${priorityBadges(tags)}</button>`}

ck">${flights.length?flights.map(x=>mobileFlightCard(x.f,x.type)).join(''):`<div class="empty">No active flights at ${esc(currentStationCode())}.</div>`}</div>${im.length+ex.length>4?`<button class="secondary" style="width:100%" onclick="openScreen('mobileflights')">View all flights</button>`:''}</div>`;

function recordOperatingDateKey(r){
  if(!r)return '';
  const raw=String(r.flightDate||'').trim();
  if(raw){
    try{return flightDateISO({flightDate:raw})}catch{}
  }
  return localDateKey(r.finalizedAt||Date.now());
}
function flightOperatingDateKey(f){
  try{return flightDateISO(f)}catch{return todayDateKey()}
}
function supervisorTodaySnapshot(){
  const key=todayDateKey();
  const activeImp=activeFlights('imports').filter(f=>flightOperatingDateKey(f)===key);
  const activeExp=activeFlights('exports').filter(f=>flightOperatingDateKey(f)===key);
  const doneImp=(state.completedImports||[]).filter(r=>recordOperatingDateKey(r)===key);
  const doneExp=(state.completedExports||[]).filter(r=>recordOperatingDateKey(r)===key);
  let importExpected=0,importReceived=0,exportExpected=0,exportDelivered=0;
  activeImp.forEach(f=>{importExpected+=f.ulds.length;importReceived+=f.ulds.filter(u=>u.status==='Received').length});
  doneImp.forEach(r=>{const s=r.summary||{};importExpected+=Number(s.expected??(r.ulds||[]).length)||0;importReceived+=Number(s.received??(r.ulds||[]).filter(u=>u.status==='Received').length)||0});
  activeExp.forEach(f=>{exportExpected+=f.ulds.length;exportDelivered+=f.ulds.filter(u=>u.status==='At Aircraft').length});
  doneExp.forEach(r=>{const n=(r.ulds||[]).length;exportExpected+=n;exportDelivered+=n});
  return {
    key,
    importExpected,importReceived,exportExpected,exportDelivered,
    importFlights:activeImp.length+doneImp.length,
    exportFlights:activeExp.length+doneExp.length,
    importsComplete:doneImp.length,
    exportsComplete:doneExp.length
  };
}
function exportDepartureMs(f){
  const fs=f?.flightStatus||{};
  return toMs(fs.estimatedDeparture||fs.scheduledDeparture||f?.estimatedDeparture||f?.scheduledDeparture);
}
function shortDurationMinutes(minutes){
  const n=Math.round(Number(minutes)||0),abs=Math.abs(n),h=Math.floor(abs/60),m=abs%60;
  return h?`${h}h ${m}m`:`${m}m`;
}
function exportSlaState(f){
  const c=counts(f,'exports'),complete=c.total>0&&c.done===c.total,etd=exportDepartureMs(f);
  if(complete)return {level:'green',rank:4,label:'AT AIRCRAFT',detail:'SLA complete',etd,minutesToEtd:etd?Math.ceil((etd-Date.now())/60000):null,c};
  if(!etd)return {level:'neutral',rank:3,label:'ETD REQUIRED',detail:'Set ETD to start 60-minute aircraft SLA',etd:null,minutesToEtd:null,c};
  const mins=Math.ceil((etd-Date.now())/60000);
  if(mins<=60){
    const late=60-mins;
    return {level:'red',rank:0,label:'HIGH PRIORITY',detail:late>0?`Aircraft SLA overdue by ${shortDurationMinutes(late)}`:'Cargo due at aircraft now',etd,minutesToEtd:mins,c};
  }
  if(mins<=90)return {level:'amber',rank:1,label:'WATCH',detail:`${shortDurationMinutes(mins-60)} until aircraft SLA`,etd,minutesToEtd:mins,c};
  return {level:'green',rank:2,label:'ON TRACK',detail:`${shortDurationMinutes(mins-60)} until aircraft SLA`,etd,minutesToEtd:mins,c};
}
function supervisorExportFlights(){
  // Wallboard shows every open/unfinalised export flight, regardless of operating date.
  // Daily KPI cards remain date-scoped separately in supervisorTodaySnapshot().
  return activeFlights('exports').map(f=>({f,s:exportSlaState(f)})).sort((a,b)=>{
    if(a.s.rank!==b.s.rank)return a.s.rank-b.s.rank;
    const ae=a.s.etd||Number.MAX_SAFE_INTEGER,be=b.s.etd||Number.MAX_SAFE_INTEGER;
    if(ae!==be)return ae-be;
    return String(a.f.flightDate||'').localeCompare(String(b.f.flightDate||''));
  });
}
function exportSlaSummary(){
  const rows=supervisorExportFlights();
  return {rows,red:rows.filter(x=>x.s.level==='red').length,amber:rows.filter(x=>x.s.level==='amber').length,missing:rows.filter(x=>x.s.level==='neutral').length};
}
function isCxUaMail(f,u){
  const carrier=airlineCode(f?.flight||'');
  return ['CX','UA'].includes(carrier)&&priorityTagsFor(f,u,'imports').some(t=>t.key==='MAIL');
}
function mailSlaState(f,u){
  const fs=f?.flightStatus||{},inBlock=toMs(fs.inBlockAt||fs.actualIn),scanned=toMs(u?.mailScannedAt);
  if(scanned)return {level:'green',rank:4,label:'SCANNED',detail:`Scanned ${fmtTime(scanned)}`,inBlock,scanned,remaining:null,deadline:inBlock?inBlock+180*60000:null};
  if(!inBlock)return {level:'neutral',rank:3,label:'IN-BLOCK NEEDED',detail:'Set aircraft In Block to start 3-hour mail SLA',inBlock:null,scanned:null,remaining:null,deadline:null};
  const deadline=inBlock+180*60000,remaining=Math.ceil((deadline-Date.now())/60000);
  if(remaining<=0)return {level:'red',rank:0,label:'OVERDUE',detail:`Mail scan overdue by ${shortDurationMinutes(-remaining)}`,inBlock,scanned:null,remaining,deadline};
  if(remaining<=60)return {level:'amber',rank:1,label:'DUE SOON',detail:`${shortDurationMinutes(remaining)} remaining`,inBlock,scanned:null,remaining,deadline};
  return {level:'green',rank:2,label:'ON TRACK',detail:`${shortDurationMinutes(remaining)} remaining`,inBlock,scanned:null,remaining,deadline};
}
function supervisorMailItems(){
  const out=[];
  activeFlights('imports').forEach(f=>f.ulds.forEach(u=>{
    if(isCxUaMail(f,u))out.push({f,u,s:mailSlaState(f,u)});
  }));
  return out.sort((a,b)=>{
    if(a.s.rank!==b.s.rank)return a.s.rank-b.s.rank;
    return (a.s.deadline||Number.MAX_SAFE_INTEGER)-(b.s.deadline||Number.MAX_SAFE_INTEGER);
  });
}
function supervisorMailSummary(){
  const rows=supervisorMailItems();
  return {rows,red:rows.filter(x=>x.s.level==='red').length,amber:rows.filter(x=>x.s.level==='amber').length,pending:rows.filter(x=>!x.s.scanned).length,scanned:rows.filter(x=>x.s.scanned).length};
}

async function saveExportEtd(id){
  const f=state.exports.find(x=>x.id===id);if(!f||!f.azureFlightId)return;
  const date=document.getElementById('exportEtdDate')?.value,time=document.getElementById('exportEtdTime')?.value;
  if(!date||!time){toast('Enter the departure date and ETD');return}
  const local=new Date(`${date}T${time}:00`);
  if(Number.isNaN(local.getTime())){toast('ETD is invalid');return}
  showActionLoader('Saving ETD…',`${f.flight} • supervisor SLA`);
  try{
    const res=await fetch('/api/flights',{method:'PATCH',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({flightId:f.azureFlightId,estimatedDepartureUtc:local.toISOString()})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.ok===false)throw new Error(data.error||data.detail||`Flights API ${res.status}`);
    f.flightStatus={...(f.flightStatus||{}),estimatedDeparture:local.toISOString(),provider:f.flightStatus?.provider||'CargoRun Supervisor'};
    logEvent('Flight','Export ETD set',{flight:f.flight,detail:`ETD ${local.toLocaleString()}`});
    save();closeModal();render();toast(`${f.flight} ETD set to ${fmtTime(local.getTime())}`);
  }catch(err){console.error(err);toast(err?.message||'ETD could not be saved')}
  finally{hideActionLoader()}
}

async function confirmBulkMailScanned(flightId,uldNumber){
  const f=state.imports.find(x=>x.id===flightId),u=f?.ulds.find(x=>x.num===uldNumber);if(!f||!u||!u.azureUldId)return;
  showActionLoader('Recording mail scan…',`${f.flight} • ${u.num}`);
  try{
    const res=await fetch('/api/mail-scan',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({uldId:u.azureUldId})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.ok===false)throw new Error(data.error||data.detail||`Mail scan API ${res.status}`);
    const r=data.uld||{};
    u.mailScannedAt=toMs(r.MailScannedAtUtc)||Date.now();
    u.mailScannedBy=r.MailScannedByDisplayName||currentUser().name;
    logEvent('Mail','Bulk mail scanned',{flight:f.flight,uld:u.num,detail:`3-hour mail SLA scan confirmed${data.alreadyScanned?' • already recorded':''}`});
    save();closeModal();render();toast(`${f.flight} ${u.num} mail scan recorded`);
  }catch(err){console.error(err);toast(err?.message||'Mail scan could not be recorded')}
  finally{hideActionLoader()}
}
function toggleSupervisorWallboard(){
  const entering=!document.body.classList.contains('supervisor-wallboard-mode');
  if(entering){
    document.body.classList.add('supervisor-wallboard-mode');
    document.documentElement.requestFullscreen?.().catch(()=>{});
  }else{
    document.body.classList.remove('supervisor-wallboard-mode');
    if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  }
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('supervisor-wallboard-mode')});

ready to finalise`);render()}else{toast(`${u.num} → ${u.status}`);render()}}

function findWarehouseDepartureTime(flight,uld){const f=state.exports.find(x=>x.flight===flight),u=f?.ulds.find(x=>x.num===uld);if(u?.departedWarehouseAt)return u.departedWarehouseAt;const e=(state.history||[]).find(x=>x.flight===flight&&x.uld===uld&&x.from==='Warehouse'&&x.to==='Transit');return e?.ts||null}

function xU16(v, o) {
  return v.getUint16(o, true);
}


function xU32(v, o) {
  return v.getUint32(o, true);
}


async function unzipXlsxEntries(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);

  let eocd = -1;

  for (
    let i = bytes.length - 22;
    i >= Math.max(0, bytes.length - 66000);
    i--
  ) {
    if (xU32(view, i) === 0x06054b50) {
      eocd = i;
      break;
    }
  }

  if (eocd < 0) {
    throw new Error(
      'This does not appear to be a valid .xlsx file.'
    );
  }

  const total = xU16(view, eocd + 10);
  const cdOffset = xU32(view, eocd + 16);
  const td = new TextDecoder('utf-8');

  const entries = {};

  let p = cdOffset;

  for (let n = 0; n < total; n++) {
    if (xU32(view, p) !== 0x02014b50) {
      throw new Error('Invalid Excel file directory.');
    }

    const method = xU16(view, p + 10);
    const compSize = xU32(view, p + 20);
    const uncompSize = xU32(view, p + 24);
    const fnLen = xU16(view, p + 28);
    const extraLen = xU16(view, p + 30);
    const commentLen = xU16(view, p + 32);
    const localOff = xU32(view, p + 42);

    const name = td.decode(
      bytes.slice(
        p + 46,
        p + 46 + fnLen
      )
    );

    entries[name] = {
      method,
      compSize,
      uncompSize,
      localOff
    };

    p += 46 + fnLen + extraLen + commentLen;
  }

  async function read(name) {
    const e = entries[name];

    if (!e) {
      return null;
    }

    const lo = e.localOff;

    if (xU32(view, lo) !== 0x04034b50) {
      throw new Error('Invalid Excel file entry.');
    }

    const fnLen = xU16(view, lo + 26);
    const extraLen = xU16(view, lo + 28);

    const start =
      lo +
      30 +
      fnLen +
      extraLen;

    const comp = bytes.slice(
      start,
      start + e.compSize
    );

    if (e.method === 0) {
      return comp;
    }

    if (e.method === 8) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error(
          'Excel upload requires a modern Chrome or Edge browser.'
        );
      }

      const ds =
        new DecompressionStream('deflate-raw');

      const stream =
        new Blob([comp])
          .stream()
          .pipeThrough(ds);

      return new Uint8Array(
        await new Response(stream).arrayBuffer()
      );
    }

    throw new Error(
      'Unsupported Excel compression method.'
    );
  }

  return {
    entries,
    read
  };
}


function decodeXlsxXml(s) {
  return String(s || '')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}


function xlsxColIndex(ref = 'A1') {
  let n = 0;

  const letters =
    (ref.match(/[A-Z]+/i) || ['A'])[0]
      .toUpperCase();

  for (const ch of letters) {
    n =
      n * 26 +
      (ch.charCodeAt(0) - 64);
  }

  return n - 1;
}


function parseSharedStrings(xml = '') {
  const out = [];

  let m;

  const si =
    /<si\b[^>]*>([\s\S]*?)<\/si>/gi;

  while ((m = si.exec(xml))) {
    let t = '';
    let tm;

    const tr =
      /<t\b[^>]*>([\s\S]*?)<\/t>/gi;

    while ((tm = tr.exec(m[1]))) {
      t += decodeXlsxXml(tm[1]);
    }

    out.push(t);
  }

  return out;
}


function parseSheetRows(xml, shared = []) {
  const rows = [];

  let rm;

  const rr =
    /<row\b[^>]*>([\s\S]*?)<\/row>/gi;

  while ((rm = rr.exec(xml))) {
    const row = [];

    let cm;

    const cr =
      /<c\b([^>]*)>([\s\S]*?)<\/c>/gi;

    while ((cm = cr.exec(rm[1]))) {
      const attrs = cm[1];
      const body = cm[2];

      const ref =
        (attrs.match(/\br="([^"]+)"/) || [])[1] ||
        'A1';

      const t =
        (attrs.match(/\bt="([^"]+)"/) || [])[1] ||
        '';

      let val = '';

      if (t === 'inlineStr') {
        let tm;

        const tr =
          /<t\b[^>]*>([\s\S]*?)<\/t>/gi;

        while ((tm = tr.exec(body))) {
          val += decodeXlsxXml(tm[1]);
        }
      } else {
        const vm =
          body.match(
            /<v\b[^>]*>([\s\S]*?)<\/v>/i
          );

        if (vm) {
          val = decodeXlsxXml(vm[1]);

          if (t === 's') {
            val =
              shared[Number(val)] ??
              val;
          } else if (
            t === 'n' ||
            t === ''
          ) {
            const num = Number(val);

            if (Number.isFinite(num)) {
              val = num;
            }
          }
        }
      }

      row[xlsxColIndex(ref)] = val;
    }

    rows.push(row);
  }

  return rows;
}


function xlsxSplitShcs(v) {
  return String(v || '')
    .split(/[,\s]+/)
    .map(x =>
      x
        .trim()
        .toUpperCase()
    )
    .filter(Boolean);
}


function xlsxHeader(v) {
  return String(v || '')
    .replace(/\s+/g, ' ')
    .trim()
    .toUpperCase();
}


function xlsxFindHeader(headers, names) {
  for (
    let i = 0;
    i < headers.length;
    i++
  ) {
    const h =
      xlsxHeader(headers[i]);

    if (
      names.some(n =>
        h.includes(n)
      )
    ) {
      return i;
    }
  }

  return -1;
}


function parseCargoRunRows(
  rows,
  filename = ''
) {
  const top =
    (rows[0] || [])
      .map(x =>
        String(x ?? '')
      )
      .join(' | ')
      .toUpperCase();

  let type = null;

  if (
    /IMPORT\s+ULD\s+LIST/.test(top)
  ) {
    type = 'imports';
  } else if (
    /EXPORT\s+UNIT\s+LIST/.test(top) ||
    /EXPORT\s+ULD\s+LIST/.test(top)
  ) {
    type = 'exports';
  } else {
    throw new Error(
      'CargoRun could not detect Import or Export. ' +
      'The top of the sheet must say “Import ULD List” ' +
      'or “Export Unit List”.'
    );
  }

  const allTop =
    rows
      .slice(0, 2)
      .flat()
      .map(x =>
        String(x ?? '')
      )
      .join(' | ');

  let flight = '';
  let flightDate = '';

  if (type === 'imports') {
    const m =
      allTop.match(
        /Import\s+ULD\s+List\s*\(\s*([A-Z0-9]+)\s+([^\)]+)\)/i
      );

    if (m) {
      flight =
        m[1].toUpperCase();

      flightDate =
        m[2].trim();
    }

  } else {
    const fm =
      allTop.match(
        /Flight\s*Number\s*:\s*([A-Z0-9]+)/i
      );

    const dm =
      allTop.match(
        /Date\s*:\s*([^|]+)/i
      );

    if (fm) {
      flight =
        fm[1].toUpperCase();
    }

    if (dm) {
      flightDate =
        dm[1].trim();
    }
  }

  if (!flight) {
    const fm =
      filename.match(
        /(?:ImportULDList_|Export_ULD_List_)([A-Z0-9]+)/i
      );

    if (fm) {
      flight =
        fm[1].toUpperCase();
    }
  }

  if (!flight) {
    throw new Error(
      'Flight number could not be read from the worksheet.'
    );
  }

  const headerRowIndex =
    rows.findIndex(r =>
      (r || []).some(c =>
        /ULD\s*(NUMBER|NUMBER\s*\/\s*BULK)/i
          .test(
            String(c || '')
          )
      )
    );

  if (headerRowIndex < 0) {
    throw new Error(
      'CargoRun could not find the ULD header row.'
    );
  }

  const headers =
    rows[headerRowIndex] || [];

  const uldCol =
    xlsxFindHeader(
      headers,
      [
        'ULD NUMBER / BULK',
        'ULD NUMBER'
      ]
    );

  const shcCol =
    xlsxFindHeader(
      headers,
      ['SHC']
    );

  const unitTypeCol =
    xlsxFindHeader(
      headers,
      ['ULD TYPE']
    );

  const weightCol =
    xlsxFindHeader(
      headers,
      type === 'imports'
        ? ['MANIFEST WEIGHT']
        : ['GROSS WEIGHT']
    );

  const contourCol =
    xlsxFindHeader(
      headers,
      ['CONTOUR']
    );

  const remarksCol =
    xlsxFindHeader(
      headers,
      ['ULD REMARKS']
    );

  const priorityCol =
    xlsxFindHeader(
      headers,
      ['PRIORITY']
    );

  if (uldCol < 0) {
    throw new Error(
      'ULD Number column was not found.'
    );
  }

  const ulds = [];

  for (
    const row of
    rows.slice(
      headerRowIndex + 1
    )
  ) {
    const num =
      String(
        row[uldCol] ?? ''
      )
        .trim()
        .toUpperCase();

    if (
      !num ||
      !/[A-Z]/.test(num) ||
      !/\d/.test(num)
    ) {
      continue;
    }

    const handling =
      type === 'imports' &&
      unitTypeCol >= 0
        ? String(
            row[unitTypeCol] ?? ''
          )
            .trim()
            .toUpperCase()
        : '';

    const rawWeight =
      weightCol >= 0
        ? Number(
            row[weightCol]
          )
        : NaN;

    const handlingType =
      handling.includes('BREAKDOWN')
        ? 'BREAKDOWN'
        : handling.includes('INTACT')
          ? 'INTACT'
          : '';

    ulds.push({
      num,

      shcs:
        shcCol >= 0
          ? xlsxSplitShcs(
              row[shcCol]
            )
          : [],

      status:
        type === 'imports'
          ? 'Unarrived'
          : 'Warehouse',

      handlingType,

      rawHandling:
        handling,

      weight:
        Number.isFinite(
          rawWeight
        )
          ? rawWeight
          : null,

      contour:
        contourCol >= 0
          ? String(
              row[contourCol] ?? ''
            ).trim()
          : '',

      remarks:
        remarksCol >= 0
          ? String(
              row[remarksCol] ?? ''
            ).trim()
          : '',

      priority:
        priorityCol >= 0
          ? String(
              row[priorityCol] ?? ''
            ).trim()
          : ''
    });
  }

  if (!ulds.length) {
    throw new Error(
      'No ULD records were found in the file.'
    );
  }

  return {
    type,
    flight,
    flightDate,
    ulds,
    sourceFile: filename
  };
}


async function parseCargoRunWorkbook(file) {
  const arr =
    await file.arrayBuffer();

  const zip =
    await unzipXlsxEntries(arr);

  const td =
    new TextDecoder('utf-8');

  const sharedBytes =
    await zip.read(
      'xl/sharedStrings.xml'
    );

  const shared =
    sharedBytes
      ? parseSharedStrings(
          td.decode(
            sharedBytes
          )
        )
      : [];

  const sheetName =
    Object
      .keys(zip.entries)
      .filter(n =>
        /^xl\/worksheets\/sheet\d+\.xml$/i
          .test(n)
      )
      .sort()[0];

  if (!sheetName) {
    throw new Error(
      'No worksheet was found in the Excel file.'
    );
  }

  const sheetBytes =
    await zip.read(sheetName);

  if (!sheetBytes) {
    throw new Error(
      'Worksheet data could not be read.'
    );
  }

  return parseCargoRunRows(
    parseSheetRows(
      td.decode(sheetBytes),
      shared
    ),
    file.name
  );
}


async function handleFlightWorkbook(event) {
  const file =
    event.target.files?.[0];

  const box =
    document.getElementById(
      'uploadPreview'
    );

  const btn =
    document.getElementById(
      'createFlightBtn'
    );

  pendingFlightUpload = null;

  if (!file) {
    return;
  }

  box.className =
    'upload-preview loading';

  box.innerHTML =
    'Reading <strong>' +
    esc(file.name) +
    '</strong>…';

  btn.disabled = true;

  try {
    const parsed =
      await parseCargoRunWorkbook(
        file
      );

    pendingFlightUpload =
      parsed;

    const hc = {
      intact:
        parsed.ulds.filter(
          u =>
            u.handlingType ===
            'INTACT'
        ).length,

      breakdown:
        parsed.ulds.filter(
          u =>
            u.handlingType ===
            'BREAKDOWN'
        ).length
    };

    const totalWeight =
      parsed.ulds.reduce(
        (s, u) =>
          s +
          (
            Number(u.weight) ||
            0
          ),
        0
      );

    const priorityTags = [];
    const uploadFlight = {flight: parsed.flight};
    for (const u of parsed.ulds) {
      for (const tag of priorityTagsFor(uploadFlight, u, parsed.type)) {
        if (!priorityTags.some(x => x.key === tag.key)) priorityTags.push(tag);
      }
    }

    box.className =
      'upload-preview';

    box.innerHTML = `
      <div class="upload-preview-head">

        <div>
          <strong>
            ${esc(parsed.flight)}
          </strong>

          <small>
            ${esc(parsed.flightDate || 'Date not supplied')}
            •
            ${esc(parsed.sourceFile)}
          </small>
        </div>

        <span class="detect-badge ${parsed.type}">
          ${
            parsed.type === 'imports'
              ? 'Import detected'
              : 'Export detected'
          }
        </span>

      </div>

      <div class="upload-stats">

        <div class="upload-stat">
          <span>ULDs</span>
          <strong>
            ${parsed.ulds.length}
          </strong>
        </div>

        ${
          parsed.type === 'imports'
            ? `
              <div class="upload-stat">
                <span>INTACT</span>
                <strong>${hc.intact}</strong>
              </div>

              <div class="upload-stat">
                <span>BREAKDOWN</span>
                <strong>${hc.breakdown}</strong>
              </div>
            `
            : `
              <div class="upload-stat">
                <span>Total weight</span>
                <strong>
                  ${esc(formatWeight(totalWeight))}
                </strong>
              </div>

              <div class="upload-stat">
                <span>Priority categories</span>
                <strong>
                  ${priorityTags.length}
                </strong>

      </div>

      ${

          ? `
            <div style="margin-top:10px">
