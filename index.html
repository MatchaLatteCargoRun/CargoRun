          : ''
      }
    `;

    btn.disabled = false;

    btn.textContent =
      parsed.type === 'imports'
        ? 'Create Import Flight'
        : 'Create Export Flight';

  } catch (err) {
    box.className =
      'upload-preview error';

    box.textContent =
      err?.message ||
      'The Excel file could not be read.';

    btn.disabled = true;
  }
}


function cargoRunApiDate(value) {
  const raw =
    String(value || '')
      .trim();

  if (!raw) {
    throw new Error(
      'The flight date could not be read from the Excel file.'
    );
  }

  // Already YYYY-MM-DD
  if (
    /^\d{4}-\d{2}-\d{2}$/
      .test(raw)
  ) {
    return raw;
  }

  // Australian DD/MM/YYYY
  // or DD-MM-YYYY
  let m =
    raw.match(
      /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
    );

  if (m) {
    return (
      `${m[3]}-` +
      `${String(m[2]).padStart(2, '0')}-` +
      `${String(m[1]).padStart(2, '0')}`
    );
  }

  // Example:
  // 13 Sep 2026
  const parsed =
    new Date(raw);

  if (
    !Number.isNaN(
      parsed.getTime()
    )
  ) {
    const year =
      parsed.getFullYear();

    const month =
      String(
        parsed.getMonth() + 1
      ).padStart(
        2,
        '0'
      );

    const day =
      String(
        parsed.getDate()
      ).padStart(
        2,
        '0'
      );

    return (
      `${year}-${month}-${day}`
    );
  }

  throw new Error(
    `CargoRun could not understand the flight date: ${raw}`
  );
}


async function createUploadedFlight() {
  const p =
    pendingFlightUpload;

  if (!p) {
    return;
  }

  const target =
    state[p.type];

  // Daily flight numbers repeat, so a flight is only a duplicate
  // when the flight number AND operating date match within the
  // same direction list. Yesterday's MH149 must not block today's.
  const pendingFlightNumber =
    String(p.flight || '')
      .trim()
      .toUpperCase();

  const pendingOperatingDate =
    cargoRunApiDate(p.flightDate);

  const duplicateFlight =
    target.find(f => {
      if (f.closed) {
        return false;
      }

      const existingFlightNumber =
        String(f.flight || '')
          .trim()
          .toUpperCase();

      if (existingFlightNumber !== pendingFlightNumber) {
        return false;
      }

      try {
        return cargoRunApiDate(f.flightDate) === pendingOperatingDate;
      } catch {
        return false;
      }
    });

  if (duplicateFlight) {
    toast(
      `${pendingFlightNumber} for ${p.flightDate} is already active in CargoRun`
    );

    return;
  }

  const btn =
    document.getElementById(
      'createFlightBtn'
    );

  try {
    if (btn) {
      btn.disabled = true;
      btn.textContent =
        'Saving to Azure…';
    }

    const operatingDate =
      cargoRunApiDate(
        p.flightDate
      );

    const airlineMatch =
      String(
        p.flight || ''
      )
        .toUpperCase()
        .match(
          /^([A-Z]{2,3})/
        );

    const payload = {
      flight: {
        flightNumber:
          p.flight,

        operatingDate,

        direction:
          p.type === 'imports'
            ? 'IMPORT'
            : 'EXPORT',

        airlineCode:
          airlineMatch
            ? airlineMatch[1]
            : null,

        // CargoRun Melbourne
        // prototype
        originAirport:
          p.type === 'exports'
            ? 'MEL'
            : null,

        destinationAirport:
          p.type === 'imports'
            ? 'MEL'
            : null,

        sourceFileName:
          p.sourceFile ||
          'CargoRun Excel Upload'
      },

      ulds:
        p.ulds.map(
          u => ({
            uldNumber:
              u.num,

            handlingType:
              u.handlingType ||
              null,

            weightKg:
              u.weight ??
              null,

            remarks:
              u.remarks ||
              null,

            priorityText:
              u.priority ||
              null,

            shcs:
              Array.isArray(
                u.shcs
              )
                ? u.shcs
                : []
          })
        )
    };

    const response =
      await fetch(
        '/api/manifest-upload',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    const result =
      await response
        .json()
        .catch(
          () => ({})
        );

    if (!response.ok) {
      throw new Error(
        result.error ||
        result.detail ||
        `Azure upload failed (${response.status})`
      );
    }

    /*
      Temporary hybrid mode:

      Azure SQL is now the
      authoritative central store,
      while the current browser UI
      still uses local state so the
      existing interface continues
      working.

      Next stage:
      load flights from Azure.
    */

    const azureUlds =
      new Map(
        (result.ulds || [])
          .map(
            u => [
              String(
                u.UldNumber ||
                ''
              )
                .toUpperCase(),

              u
            ]
          )
      );

    const shcs = [
      ...new Set(
        p.ulds.flatMap(
          u =>
            u.shcs ||
            []
        )
      )
    ];

    const flight = {
      id:
        (
          p.type === 'imports'
            ? 'imp-'
            : 'exp-'
        ) +
        Date.now(),

      azureFlightId:
        result.flight?.FlightId ||
        null,

      flight:
        p.flight,

      flightDate:
        p.flightDate ||
        '',

      sourceFile:
        p.sourceFile ||
        '',

      sourceType:
        'Excel ULD List',

      uploadedAt:
        Date.now(),

      shcs,

      closed:
        false,

      ulds:
        p.ulds.map(
          u => ({
            ...u,

            azureUldId:
              azureUlds.get(
                String(
                  u.num ||
                  ''
                )
                  .toUpperCase()
              )?.UldId ||
              null
          })
        )
    };

    target.unshift(
      flight
    );

    const hc =
      handlingCounts(
        flight
      );

    logEvent(
      'Upload',
      'Flight data uploaded',
      {
        flight:
          p.flight,

        detail:
          p.type === 'imports'
            ? (
              `${p.ulds.length} ULDs • ` +
              `${hc.intact} INTACT • ` +
              `${hc.breakdown} BREAKDOWN`
            )
            : (
              `${p.ulds.length} export ULDs loaded`
            ),

        user:
          currentUser().name
      }
    );

    save();

    pendingFlightUpload =
      null;

    closeModal();

    toast(
      `${p.flight} saved to Azure — ${p.ulds.length} ULDs`
    );

    openScreen(
      'flight',
      p.type,
      flight.id
    );

    if (
      p.type === 'imports' &&
      canUseFlightStatusApi()
    ) {
      setTimeout(
        () =>
          syncFlightArrivalById(
            flight.id,
            true
          ),
        250
      );
    }

  } catch (err) {
    console.error(
      'CargoRun manifest upload failed',
      err
    );

    toast(
      err?.message ||
      'CargoRun could not save the flight to Azure'
    );

    if (btn) {
      btn.disabled =
        false;

      btn.textContent =
        p.type === 'imports'
          ? 'Create Import Flight'
          : 'Create Export Flight';
    }
  }
}
