function cargoRunApiDate(value) {
  const raw =
    String(value || '')
      .trim();

  if (!raw) {
    throw new Error(
      'The flight date could not be read from the Excel file.'
    );
  }

  // Already YYYY-MM-DD
  if (
    /^\d{4}-\d{2}-\d{2}$/
      .test(raw)
  ) {
    return raw;
  }

  // Australian DD/MM/YYYY
  // or DD-MM-YYYY
  let m =
    raw.match(
      /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
    );

  if (m) {
    return (
      `${m[3]}-` +
      `${String(m[2]).padStart(2, '0')}-` +
      `${String(m[1]).padStart(2, '0')}`
    );
  }

  // Example:
  // 13 Sep 2026
  const parsed =
    new Date(raw);

  if (
    !Number.isNaN(
      parsed.getTime()
    )
  ) {
    const year =
      parsed.getFullYear();

    const month =
      String(
        parsed.getMonth() + 1
      ).padStart(
        2,
        '0'
      );

    const day =
      String(
        parsed.getDate()
      ).padStart(
        2,
        '0'
      );

    return (
      `${year}-${month}-${day}`
    );
  }

  throw new Error(
    `CargoRun could not understand the flight date: ${raw}`
  );
}


async function reviewExportUwsUpload(p) {
  const generation = operationalSessionGeneration;
  const btn = document.getElementById('createFlightBtn');
  if (!operationalSessionIsCurrent(generation)) return;
  if (!p?._workbook || !p.exactFlightId) {
    toast('Select the Export UWS again.');
    return;
  }
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Validating UWS…';
  }
  showActionLoader('Reviewing Export UWS…', `${p.flight} • validating exact FlightId and FINAL membership`);
  try {
    const response = await fetch('/api/manifest-upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        action: 'REVIEW_EXPORT_UWS',
        sourceFileName: p.sourceFile || '',
        workbook: p._workbook
      })
    });
    const result = await response.json().catch(() => ({}));
    if (!operationalSessionIsCurrent(generation)) return;
    if (!response.ok || result.ok === false) throw new Error(result.error || `Export UWS review ${response.status}`);
    const reviewedFlightId = stableOperationalId(result.exactMatch?.flightId);
    if (!reviewedFlightId || reviewedFlightId !== p.exactFlightId) {
      throw new Error('Export UWS flight identity changed; select the document again.');
    }

    await syncCentralData(true,{services:['flights']});
    const flight = findFlightByStableId('exports', reviewedFlightId);
    if (!operationalSessionIsCurrent(generation)) return;
    if (!flight) throw new Error('The exact matched export flight is not available after refresh.');
    if (flight.exportManifestFinal) throw new Error("FLIGHT IS FINAL. This flight's final build is locked. No changes have been made.");

    flight.finalManifestDraft = cargoRunUwsDraft(result.document || {}, p.sourceFile || '');
    save();
    pendingFlightUpload = null;
    closeModal();
    openScreen('flight', 'exports', reviewedFlightId);
    deferOperational(generation,() => previewFinalManifest(reviewedFlightId),50);
  } catch (error) {
    if (!operationalSessionIsCurrent(generation)) return;
    console.error('CargoRun Export UWS review failed', error);
    toast(error?.message || 'CargoRun could not review the Export UWS');
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Review FINAL';
    }
  } finally {
    if (operationalSessionIsCurrent(generation)) hideActionLoader();
  }
}


async function createUploadedFlight() {
  const generation = operationalSessionGeneration;
  const p =
    pendingFlightUpload;

  if (!p || !operationalSessionIsCurrent(generation)) {
    return;
  }

  if (p.documentType === 'EXPORT_UWS') {
    await reviewExportUwsUpload(p);
    return;
  }

  const target =
    state[p.type];

  // Daily flight numbers repeat, so a flight is only a duplicate
  // when the flight number AND operating date match within the
  // same direction list. Yesterday's MH149 must not block today's.
  const pendingFlightNumber =
    String(p.flight || '')
      .trim()
      .toUpperCase();

  const pendingOperatingDate =
    cargoRunApiDate(p.flightDate);

  const duplicateFlights =
    target.filter(f => {
      if (f.closed) {
        return false;
      }

      const existingFlightNumber =
        normalizeFlightLookup(f.flight);

      if (existingFlightNumber !== normalizeFlightLookup(pendingFlightNumber)) {
        return false;
      }

      try {
        return cargoRunApiDate(f.flightDate) === pendingOperatingDate;
      } catch {
        return false;
      }
    });

  if (duplicateFlights.length > 1) {
    toast('Multiple CargoRun flights match this number and date. Review the flight records before confirming FINAL.');
    return;
  }

  const duplicateFlight = duplicateFlights[0] || null;

  if (duplicateFlight) {
    if (p.type === 'exports') {
      if (duplicateFlight.exportManifestFinal) {
        toast(`${pendingFlightNumber} for ${p.flightDate} is FINAL. The manifest is locked.`);
        return;
      }
      duplicateFlight.finalManifestDraft = p;
      save();
      closeModal();
      openScreen('flight', 'exports', duplicateFlight.azureFlightId);
      deferOperational(generation,() => previewFinalManifest(duplicateFlight.azureFlightId),50);
      return;
    }
    toast(
      `${pendingFlightNumber} for ${p.flightDate} is already active in CargoRun`
    );

    return;
  }

  const btn =
    document.getElementById(
      'createFlightBtn'
    );

  try {
    if (btn) {
      btn.disabled = true;
      btn.textContent =
        'Saving to Azure…';
    }

    const operatingDate =
      cargoRunApiDate(
        p.flightDate
      );

    const airlineMatch =
      String(
        p.flight || ''
      )
        .toUpperCase()
        .match(
          /^([A-Z]{2,3})/
        );

    const payload = {
      flight: {
        flightNumber:
          p.flight,

        operatingDate,

        direction:
          p.type === 'imports'
            ? 'IMPORT'
            : 'EXPORT',

        airlineCode:
          airlineMatch
            ? airlineMatch[1]
            : null,

        // CargoRun Melbourne
        // prototype
        originAirport:
          p.type === 'exports'
            ? 'MEL'
            : null,

        destinationAirport:
          p.type === 'imports'
            ? 'MEL'
            : null,

        sourceFileName:
          p.sourceFile ||
          'CargoRun Excel Upload'
      },

      ulds:
        p.ulds.map(
          u => ({
            uldNumber:
              normalizeULD(u.num),

            handlingType:
              u.handlingType ||
              null,

            weightKg:
              u.weight ??
              null,

            remarks:
              u.remarks ||
              null,

            priorityText:
              u.priority ||
              null,

            shcs:
              Array.isArray(
                u.shcs
              )
                ? u.shcs
                : []
          })
        )
    };

    const response =
      await fetch(
        '/api/manifest-upload',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    const result =
      await response
        .json()
        .catch(
          () => ({})
        );

    if (!operationalSessionIsCurrent(generation)) return;

    if (!response.ok) {
      throw new Error(
        result.error ||
        result.detail ||
        `Azure upload failed (${response.status})`
      );
    }

    /*
      Temporary hybrid mode:

      Azure SQL is now the
      authoritative central store,
      while the current browser UI
      still uses local state so the
      existing interface continues
      working.

      Next stage:
      load flights from Azure.
    */

    const azureUlds =
      new Map(
        (result.ulds || [])
          .map(
            u => [
              normalizeULD(u.UldNumber),

              u
            ]
          )
      );

    const shcs = [
      ...new Set(
        p.ulds.flatMap(
          u =>
            u.shcs ||
            []
        )
      )
    ];

    const flight = {
      id:
        (
          p.type === 'imports'
            ? 'imp-'
            : 'exp-'
        ) +
        Date.now(),

      azureFlightId:
        result.flight?.FlightId ||
        null,

      flight:
        p.flight,

      flightDate:
        p.flightDate ||
        '',

      sourceFile:
        p.sourceFile ||
        '',

      sourceType:
        'Excel ULD List',

      finalManifestDraft:
        p.type === 'exports'
          ? p
          : null,

      uploadedAt:
        Date.now(),

      shcs,

      closed:
        false,

      ulds:
        p.ulds.map(
          u => ({
            ...u,

            azureUldId:
              azureUlds.get(
                normalizeULD(u.num)
              )?.UldId ||
              null
          })
        )
    };

    target.unshift(
      flight
    );

    const hc =
      handlingCounts(
        flight
      );

    logEvent(
      'Upload',
      'Flight data uploaded',
      {
        flight:
          p.flight,

        detail:
          p.type === 'imports'
            ? (
              `${p.ulds.length} ULDs • ` +
              `${hc.intact} INTACT • ` +
              `${hc.breakdown} BREAKDOWN`
            )
            : (
              `${p.ulds.length} export ULDs loaded`
            ),

        user:
          currentUser().name
      }
    );

    save();

    pendingFlightUpload =
      null;

    closeModal();

    toast(
      `${p.flight} saved to Azure — ${p.ulds.length} ULDs`
    );

    openScreen(
      'flight',
      p.type,
      flight.azureFlightId || flight.id
    );

    if (p.type === 'exports' && flight.azureFlightId) {
      deferOperational(
        generation,
        () => previewFinalManifest(flight.azureFlightId),
        80
      );
    }

    if (
      FLIGHTAWARE_ENABLED &&
      p.type === 'imports' &&
      canUseFlightStatusApi()
    ) {
      deferOperational(
        generation,
        () =>
          syncFlightArrivalById(
            flight.id,
            true
          ),
        250
      );
    }

  } catch (err) {
    if (!operationalSessionIsCurrent(generation)) return;
    console.error(
      'CargoRun manifest upload failed',
      err
    );

    toast(
      err?.message ||
      'CargoRun could not save the flight to Azure'
    );

    if (btn) {
      btn.disabled =
        false;

      btn.textContent =
        p.type === 'imports'
          ? 'Create Import Flight'
          : 'Create Export Flight';
    }
  }
}

function finalManifestRequestUlds(draft) {
  return (draft?.ulds || []).map(u => ({
    uldNumber: normalizeULD(u.num),
    handlingType: u.handlingType || null,
    weightKg: u.weight ?? null,
    remarks: u.remarks || null,
    priorityText: u.priority || null,
    shcs: Array.isArray(u.shcs) ? u.shcs : []
  }));
}

function finalManifestList(title, rows, emptyText) {
  return `<div><strong>${esc(title)}</strong><div class="manifest-reconcile-list">${rows.length
    ? rows.map(row => `<div>${esc(row.uldNumber)}${row.currentStatus ? ` • ${esc(azureStatusToUi(row.currentStatus, 'EXPORT'))}` : ''}</div>`).join('')
    : esc(emptyText)}</div></div>`;
}

async function previewFinalManifest(flightId) {
  if (!canUseStationAction('confirmExportFinal')) return false;
  const generation = operationalSessionGeneration;
  const stableFlightId = stableOperationalId(flightId);
  const flight = findFlightByStableId('exports', stableFlightId);
  const draft = flight?.finalManifestDraft;
  if (!operationalSessionIsCurrent(generation)) return;
  if (!flight || !stableFlightId) {
    toast('Select the exact export flight again.');
    return;
  }
  if (flight.exportManifestFinal) {
    toast('This flight is FINAL.');
    return;
  }
  if (!draft || !Array.isArray(draft.ulds) || !draft.ulds.length) {
    toast('Upload the final Export XLSX or UWS before confirming FINAL.');
    return;
  }
  showActionLoader('Preparing FINAL reconciliation…', `${flight.flight} • checking expected ULD membership`);
  try {
    const response = await fetch('/api/export-manifest-final', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        action: 'PREVIEW',
        flightId: stableFlightId,
        sourceFileName: draft.sourceFile || '',
        ulds: finalManifestRequestUlds(draft)
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!operationalSessionIsCurrent(generation)) return;
    if (!response.ok || data.ok === false) throw new Error(data.error || `FINAL preview API ${response.status}`);
    const r = data.reconciliation;
    if (stableOperationalId(r?.flight?.flightId) !== stableFlightId) throw new Error('FINAL preview identity mismatch');
    pendingFinalConfirmation = { flightId: stableFlightId, draft, preview: r };
    modal(`${modalHead('FINAL Export Manifest')}
      <p><strong>${esc(r.flight.flightNumber)}</strong> • ${esc(azureDisplayDate(r.flight.operatingDate))} • FlightId ${esc(stableFlightId)}</p>
      <div class="manifest-preview-grid">
        <div><span>${draft.documentType === 'EXPORT_UWS' ? 'UWS ULDs' : 'Final XLSX ULDs'}</span><strong>${r.finalUldCount}</strong></div>
        <div><span>Previously expected</span><strong>${r.previouslyExpectedCount}</strong></div>
        <div><span>Matched</span><strong>${r.matchedCount}</strong></div>
        <div><span>Added</span><strong>${r.addedCount}</strong></div>
        <div><span>Not on Final</span><strong>${r.excludedCount}</strong></div>
      </div>
      <div class="accept-note"><strong>Operational ULD statuses will not be changed.</strong> CurrentStatus, IdentityVerified, timestamps, UldId, offloads and movement history remain untouched.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        ${finalManifestList(draft.documentType === 'EXPORT_UWS' ? 'Added from UWS' : 'Added from final XLSX', r.added || [], 'No new ULDs.')}
        ${finalManifestList('Not on Final', r.excluded || [], 'No exclusions.')}
      </div>
      <div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" data-flight-id="${esc(stableFlightId)}" onclick="confirmFinalManifest('${esc(stableFlightId)}')">Confirm Final</button></div>`, 'wide');
  } catch (error) {
    if (!operationalSessionIsCurrent(generation)) return;
    console.error(error);
    toast(error?.message || 'FINAL reconciliation could not be prepared');
  } finally {
    if (operationalSessionIsCurrent(generation)) hideActionLoader();
  }
}

async function confirmFinalManifest(flightId) {
  const generation = operationalSessionGeneration;
  const stableFlightId = stableOperationalId(flightId);
  const session = pendingFinalConfirmation;
  if (!operationalSessionIsCurrent(generation)) return;
  if (!stableFlightId || !session || session.flightId !== stableFlightId) {
    toast('FINAL confirmation changed; review it again.');
    return;
  }
  const currentFlight = findFlightByStableId('exports', stableFlightId);
  if (!currentFlight || currentFlight.exportManifestFinal) {
    toast('Flight state changed; refresh and review again.');
    return;
  }
  showActionLoader('Confirming FINAL…', `${currentFlight.flight} • locking expected ULD membership`);
  try {
    const response = await fetch('/api/export-manifest-final', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        action: 'CONFIRM',
        flightId: stableFlightId,
        sourceFileName: session.draft.sourceFile || '',
        ulds: finalManifestRequestUlds(session.draft)
      })
    });
    const data = await response.json().catch(() => ({}));
    if (!operationalSessionIsCurrent(generation)) return;
    if (!response.ok || data.ok === false) throw new Error(data.error || `FINAL confirmation API ${response.status}`);
    pendingFinalConfirmation = null;
    closeModal();
    logEvent('Flight', 'EXPORT_MANIFEST_FINAL_CONFIRMED', {
      flight: currentFlight.flight,
      detail: `${data.reconciliation.finalUldCount} final ULDs • ${data.reconciliation.addedCount} added • ${data.reconciliation.excludedCount} not on final`,
      user: currentUser().name,
      persist: false
    });
    await syncCentralData(true);
    if (!operationalSessionIsCurrent(generation)) return;
    selectDesktopFlightByStableId('exports', stableFlightId);
    toast(`${currentFlight.flight} is FINAL`);
  } catch (error) {
    if (!operationalSessionIsCurrent(generation)) return;
    console.error(error);
    toast(error?.message || 'FINAL confirmation could not be saved');
  } finally {
    if (operationalSessionIsCurrent(generation)) hideActionLoader();
  }
}
function render(){
 try{
  if(cargoRunAccess.status==='checking'){const app=document.getElementById('app');if(app)app.replaceChildren();return}
  if(cargoRunAccess.status!=='provisioned'){const app=document.getElementById('app');if(app)app.innerHTML=accessGateScreen();return}
  if(!selectedStation()){const app=document.getElementById('app');if(app)app.innerHTML=stationSelectionScreen();return}
  if(selectedStationSync.status==='ERROR'){shell(stationSyncErrorScreen());return}
  if(!canOpenCargoRunScreen(route.screen))route={screen:'home',type:null,id:null};
  let content='';
  if(route.screen==='home')content=home();
  else if(route.screen==='mobileflights')content=isMobileUI()?mobileFlightsHub():flightBoardScreen();
  else if(route.screen==='more')content=isMobileUI()?mobileMoreScreen():home();
  else if(route.screen==='flights')content=flights(route.type);
  else if(route.screen==='flight')content=flightDetail(route.type,route.id,route.flightId);
  else if(route.screen==='offloads')content=offloads();
  else if(route.screen==='flightboard')content=flightBoardScreen();
  else if(route.screen==='priority')content=priorityCargoScreen();
  else if(route.screen==='supervisor')content=supervisorDashboard();
  else if(route.screen==='history')content=historyScreen();
  else if(route.screen==='machfow')content=machFowScreen();
  else if(route.screen==='admin')content=adminCentre();
  shell(content);
 }catch(err){
  console.error('CargoRun render failed',err);
  const app=document.getElementById('app');
  if(app)app.innerHTML=`<main class="shell"><div class="empty" style="margin-top:18px;text-align:left"><strong style="display:block;font-size:18px;color:#fff;margin-bottom:8px">CargoRun couldn't load this screen.</strong><div style="margin-bottom:12px">Refresh the page. If it happens again, report: ${esc(err?.message||'Unknown screen error')}</div><button class="primary" onclick="location.reload()">Refresh CargoRun</button></div></main>`;
 }
}
async function bootCargoRun(){
 let generation=operationalSessionGeneration;
 render();
 showDataLoader('Starting CargoRun…','Checking your Microsoft sign-in');
 try{
  const signedIn=await loadEntraIdentity();
  if(signedIn){
   generation=operationalSessionGeneration;
   showDataLoader('Checking CargoRun access','Confirming your CargoRun role and station access.');
   const provisioned=await loadCargoRunSession();
   if(!provisioned)return;
   generation=operationalSessionGeneration;
   const stationId=selectedStation()?.stationId;
   if(!stationId){render();return}
   await switchCargoRunStation(stationId,{reason:'startup'});
  }
 }finally{if(generation===operationalSessionGeneration)hideDataLoader(true)}
}
bootCargoRun();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
let lastMobileMode=isMobileUI();window.addEventListener('resize',()=>{const m=isMobileUI();if(m!==lastMobileMode){lastMobileMode=m;render()}});
document.addEventListener('visibilitychange',()=>{if(cargoRunAccess.status!=='provisioned'||!selectedStation())return;if(document.visibilityState!=='visible'){void centralSyncScheduler.handleVisibilityChange();return}if(route.screen==='admin'){adminConfigState={...adminConfigState,status:'loading'};render();void centralSyncScheduler.handleVisibilityChange({refresh:false});void loadAdminConfiguration();return}void centralSyncScheduler.handleVisibilityChange()});
if(FLIGHTAWARE_ENABLED){
 setInterval(()=>{if(cargoRunAccess.status==='provisioned'&&selectedStation()&&document.visibilityState==='visible'&&canUseFlightStatusApi())syncAllFlightArrivals(true)},Math.max(1,Number(flightStatusSettings().pollMinutes||2))*60000);
}
