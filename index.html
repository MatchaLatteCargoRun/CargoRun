<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#063f61" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CargoRun" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>CargoRun</title>
<style>
  :root{
    --bg:#0d557b;
    --bg-deep:#063f61;
    --panel:#08466a;
    --panel2:#0a5c83;
    --text:#f7fbff;
    --muted:#b9d2df;
    --line:rgba(255,255,255,.13);
    --green:#36d399;
    --amber:#ffc857;
    --red:#ff6b6b;
    --blue:#71c5ff;
    --shadow:0 18px 50px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#0d557b 0%,#084766 100%);color:var(--text)}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;height:68px;background:rgba(5,53,82,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
  .brand img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
  .brand span{font-size:22px}
  .station{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05)}
  .station-context{display:flex;align-items:center;gap:7px;min-width:0}.station-context strong{color:#fff}.station-context small{color:var(--muted)}
  .station-switch{max-width:180px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;padding:7px 28px 7px 10px;font-size:11px;font-weight:850}.station-switch option{color:#17394a;background:#fff}
  .station-selection{max-width:680px;margin:10vh auto 0;padding:28px}.station-selection h1{margin:10px 0 8px}.station-selection>p{margin:0;color:var(--muted);line-height:1.55}.station-choice-list{display:grid;gap:10px;margin-top:22px}.station-choice{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;padding:16px 18px;border:1px solid rgba(83,196,238,.32);border-radius:13px;background:rgba(255,255,255,.045);color:#fff;text-align:left}.station-choice:hover{border-color:var(--accent);background:rgba(44,201,255,.09)}.station-choice strong{display:block;font-size:16px}.station-choice small{display:block;margin-top:4px;color:var(--muted)}.station-choice b{color:var(--accent);font-size:20px}
  .shell{width:min(1080px,100%);margin:0 auto;padding:22px 18px 40px}
  .hero{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:4px 0 22px}
  .hero h1{font-size:clamp(27px,4vw,42px);line-height:1.05;margin:0 0 6px}
  .hero p{margin:0;color:var(--muted);font-size:14px}
  .hero-logo{width:110px;opacity:.95;filter:drop-shadow(0 12px 22px rgba(0,0,0,.18))}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .menu-card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(4,58,87,.92),rgba(4,48,74,.92));border-radius:18px;padding:22px;min-height:135px;color:white;text-align:left;box-shadow:var(--shadow);transition:.18s ease;position:relative;overflow:hidden}
  .menu-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)}
  .menu-card .title{font-size:22px;font-weight:800;margin-bottom:7px}
  .menu-card .sub{color:var(--muted);font-size:13px;max-width:80%}
  .menu-card .metric{position:absolute;right:18px;bottom:16px;font-weight:900;font-size:28px;color:white}
  .menu-card.alert .metric{color:var(--red)}
  .menu-card.warn .metric{color:var(--amber)}
  .toolbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .back,.secondary,.primary,.danger,.status-btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:white;background:rgba(255,255,255,.06);font-weight:700}
  .primary{background:#0b6d96;border-color:#1284b3}
  .danger{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.45);color:#ffd8d8}
  .spacer{flex:1}
  .screen-title{font-size:30px;font-weight:900;margin:8px 0 3px}
  .screen-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .flight-list,.uld-list,.offload-list{display:flex;flex-direction:column;gap:10px}
  .flight-row,.uld-row,.offload-row{display:grid;align-items:center;gap:12px;background:rgba(4,58,87,.86);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:0 8px 22px rgba(0,0,0,.13)}
  .flight-row{grid-template-columns:1.2fr 1.2fr .9fr;cursor:pointer}
  .flight-row:hover,.offload-row:hover{border-color:rgba(255,255,255,.28)}
  .flight-code{font-weight:900;font-size:22px;letter-spacing:.3px}
  .shcs{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:900;letter-spacing:.4px;padding:5px 8px;border-radius:999px;background:rgba(113,197,255,.14);color:#cdeeff;border:1px solid rgba(113,197,255,.26)}
  .chip.hot{background:rgba(255,200,87,.13);color:#ffe7a8;border-color:rgba(255,200,87,.28)}
  .chip.red{background:rgba(255,107,107,.13);color:#ffd0d0;border-color:rgba(255,107,107,.28)}
  .count{text-align:right;font-weight:900;font-size:14px}
  .count small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
  .progress{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
  .progress>span{display:block;height:100%;background:#7dd3fc}
  .uld-row{grid-template-columns:1fr 1.2fr auto}
  .uld-num{font-weight:900;font-size:17px}
  .uld-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .uld-inline-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .uld-flag{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:950;letter-spacing:.55px;text-transform:uppercase;border:1px solid transparent;line-height:1}
  .uld-flag.intact{background:rgba(54,211,153,.12);border-color:rgba(54,211,153,.26);color:#baf7df}
  .uld-flag.breakdown{background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.26);color:#ffe7a8}
  .uld-flag.dhl{background:#ffd94f;border-color:#ffe27f;color:#b32020;box-shadow:0 6px 16px rgba(0,0,0,.10)}
  .uld-flag.priority{background:rgba(255,107,107,.13);border-color:rgba(255,107,107,.28);color:#ffd0d0}
  .uld-flag .flag-dot{font-size:9px;line-height:1}
  .status-btn{min-width:120px;text-transform:uppercase;font-size:11px;letter-spacing:.55px}
  .status-unarrived,.status-warehouse,.status-requested{color:#f3f6f8;background:rgba(255,255,255,.07)}
  .status-arrived,.status-transit{color:#ffe3a0;background:rgba(255,200,87,.14);border-color:rgba(255,200,87,.28)}
  .status-received,.status-at-aircraft,.status-complete{color:#baf7df;background:rgba(54,211,153,.13);border-color:rgba(54,211,153,.28)}
  .detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:15px}
  .detail-head .flight-code{font-size:36px}
  .summary{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .summary span{padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:800}
  .offload-row{cursor:pointer}
  .offload-row.selected-offload,.mobile-offload-card.selected-offload{border-color:var(--accent);box-shadow:0 0 0 2px rgba(44,201,255,.28),0 8px 22px rgba(0,0,0,.13)}
  .offload-row strong{font-size:16px}
  .empty{padding:30px;text-align:center;border:1px dashed rgba(255,255,255,.2);border-radius:16px;color:var(--muted)}
  .modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,22,35,.68);backdrop-filter:blur(7px)}
  .modal-wrap.show{display:flex}
  .modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#073f60;border:1px solid rgba(255,255,255,.18);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.45);padding:22px}
  .modal.wide{width:min(1120px,96vw)}
  .modal h2{margin:0 0 7px;font-size:24px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
  .field{margin:12px 0}
  .field label{display:block;font-size:12px;font-weight:800;color:#d9edf6;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.17);background:#052f49;color:white;padding:12px 13px;outline:none}
  .field textarea{min-height:130px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#6ec8f3;box-shadow:0 0 0 3px rgba(110,200,243,.12)}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
  .filebox{border:1px dashed rgba(255,255,255,.24);border-radius:12px;padding:12px;color:var(--muted);font-size:12px}
  .toast{position:fixed;z-index:150;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#072f47;border:1px solid rgba(255,255,255,.18);color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);transition:.2s ease;max-width:min(90vw,560px);font-weight:700;font-size:13px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .footer-note{color:rgba(255,255,255,.42);font-size:11px;text-align:center;margin-top:25px}
  .hero-mascot-wrap{width:210px;max-width:35vw;display:flex;align-items:center;justify-content:center}
  .hero-mascot{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 34px rgba(0,0,0,.20))}

  /* ===== CargoRun loading + operation feedback ===== */
  .cargo-loader{position:fixed;inset:0;z-index:260;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 42%,rgba(13,85,123,.98),rgba(4,45,70,.99) 70%);opacity:0;visibility:hidden;pointer-events:none;overflow-x:hidden;transition:opacity .18s ease,visibility .18s ease}
  .cargo-loader.show{opacity:1;visibility:visible;pointer-events:auto}
  .cargo-loader-card{width:min(390px,92vw);text-align:center}
  .cargo-loader-brand{font-size:13px;font-weight:950;letter-spacing:1.5px;text-transform:uppercase;color:#cdeeff;margin-bottom:8px}
  .cargo-loader-title{font-size:24px;font-weight:900;color:#fff;margin:0}
  .cargo-loader-sub{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:18px}
  .cargo-loader-track{position:relative;width:min(196px,58vw);margin:14px auto 5px;overflow:hidden}
  .cargo-loader-track::after{content:'';position:absolute;z-index:0;left:15%;right:15%;bottom:7%;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(113,197,255,.28),rgba(255,255,255,.75),rgba(113,197,255,.28),transparent);box-shadow:0 0 18px rgba(113,197,255,.24)}
  .mascot-loader-canvas{position:relative;z-index:1;display:block;width:100%;max-width:100%;height:auto;aspect-ratio:1200/1240;filter:drop-shadow(0 10px 18px rgba(0,0,0,.24))}
  .action-loader{position:fixed;inset:0;z-index:320;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,28,44,.66);backdrop-filter:blur(3px);opacity:0;visibility:hidden;pointer-events:none;overflow-x:hidden;transition:.15s ease}
  .action-loader.show{opacity:1;visibility:visible;pointer-events:auto}
  .action-loader-card{width:min(310px,88vw);padding:22px 20px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(150deg,#07547c,#063e5d);box-shadow:0 20px 70px rgba(0,0,0,.34);text-align:center}
  .action-loader-runner{position:relative;width:min(104px,34vw);margin:0 auto 3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .action-loader-runner::after{content:'';position:absolute;z-index:0;left:18%;right:18%;bottom:7%;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(113,197,255,.22),rgba(255,255,255,.68),rgba(113,197,255,.22),transparent);box-shadow:0 0 14px rgba(113,197,255,.18)}
  .action-loader-title{font-weight:950;font-size:17px;color:#fff;margin-top:5px}.action-loader-sub{font-size:11px;color:#c6e3f0;margin-top:5px;min-height:16px}
  .priority-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.priority-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;border:1px solid rgba(255,200,87,.30);background:rgba(255,200,87,.12);color:#ffe7a8;font-size:10px;font-weight:950;letter-spacing:.3px}.priority-badge.critical{border-color:rgba(255,107,107,.34);background:rgba(255,107,107,.12);color:#ffd0d0}.priority-badge.mail{border-color:rgba(113,197,255,.34);background:rgba(113,197,255,.11);color:#d7f1ff}.priority-badge.temp{border-color:rgba(35,175,188,.40);background:rgba(35,175,188,.13);color:#c6fbff}
  .offload-instruction{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,200,87,.20);background:rgba(255,200,87,.07);color:#ffe8b2;font-size:11px;line-height:1.4}.offload-instruction strong{display:block;color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}.offload-note{color:var(--muted);font-size:10px;margin-top:5px;line-height:1.35}
  .flight-offloads{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.flight-offload-list{display:flex;flex-direction:column;gap:9px}.flight-offload-card{border:1px solid var(--line);border-radius:14px;background:rgba(4,58,87,.72);padding:13px 14px}.flight-offload-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.flight-offload-head h4{margin:0;font-size:17px}.flight-offload-ids{color:var(--muted);font-size:9px;margin-top:3px}.flight-offload-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.flight-offload-grid div{background:rgba(0,0,0,.12);border-radius:9px;padding:8px}.flight-offload-grid span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;font-weight:900;letter-spacing:.35px}.flight-offload-grid strong{display:block;font-size:11px;margin-top:3px;overflow-wrap:anywhere}.flight-offload-detail{margin-top:8px;padding:8px 10px;border-left:3px solid rgba(44,201,255,.55);background:rgba(255,255,255,.04);font-size:11px;line-height:1.4}.flight-offload-detail span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;font-weight:900;margin-bottom:2px}.flight-summary-evidence-note{margin:10px 0;color:var(--muted);font-size:10px;line-height:1.45}
  .statement-document{background:#fff;color:#16384a;border-radius:16px;box-shadow:0 16px 50px rgba(0,20,32,.22);padding:24px}
  .statement-document .statement-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-bottom:3px solid #0d557b;padding-bottom:14px;margin-bottom:14px}.statement-title h3{font-size:23px;margin:8px 0 3px}.statement-airline-badge{display:inline-flex;color:#fff;padding:6px 9px;border-radius:7px;font-weight:800;font-size:12px}.statement-muted{color:#6a7f8a;font-size:11px}.statement-state{text-align:right}.statement-status{display:inline-flex;padding:6px 9px;border-radius:999px;background:#e8f7f1;border:1px solid #b8e8d5;color:#176b50;font-size:10px;font-weight:900}.statement-version-label{display:block;color:#4d6875;font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:.6px;margin-top:6px}
  .statement-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.statement-summary>div{background:#f4f8fa;border:1px solid #dce7ec;border-radius:9px;padding:9px 10px}.statement-summary span,.statement-amendment span{display:block;color:#6a7f8a;font-size:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;margin-bottom:3px}.statement-summary strong,.statement-amendment strong{display:block;font-size:11px;line-height:1.35;overflow-wrap:anywhere}.statement-amendment{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin:10px 0;padding:10px;border-left:3px solid #0d7ca8;background:#eef6f9;border-radius:0 9px 9px 0}
  .statement-version-control{display:grid;grid-template-columns:90px minmax(220px,1fr);align-items:center;gap:10px;margin:14px 0;padding:10px;border:1px solid #dce7ec;border-radius:10px;background:#f8fbfc}.statement-version-control label{font-size:9px;text-transform:uppercase;font-weight:900;color:#6a7f8a}.statement-version-control select{width:100%;background:#fff;color:#16384a;border:1px solid #c7d5dc;border-radius:8px;padding:8px 10px;font-weight:700}
  .statement-section{margin-top:16px}.statement-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}.statement-section-title h3{margin:0;font-size:12px;letter-spacing:.7px}.statement-section-title span{color:#6a7f8a;font-size:8px;font-weight:800}.statement-table-wrap{overflow:auto;border:1px solid #dce7ec;border-radius:10px}.statement-table{width:100%;border-collapse:collapse;table-layout:auto}.statement-table th{background:#eaf2f6;color:#496370;text-transform:uppercase;letter-spacing:.35px;font-size:8px;text-align:left;padding:7px}.statement-table td{padding:7px;border-top:1px solid #e2eaee;font-size:9.5px;vertical-align:top;line-height:1.3;overflow-wrap:anywhere}.statement-table tbody tr:nth-child(4n+3){background:#fafcfd}.statement-table .num{font-weight:900;white-space:nowrap}.statement-table small{display:block;color:#708892;margin-top:2px;font-size:8px}.statement-status-pill{display:inline-flex;padding:3px 6px;border-radius:999px;background:#edf3f6;color:#385664;font-size:8px;font-weight:900}.statement-status-requested{background:#fff4d9;color:#7a5711}.statement-status-transit{background:#e8f4ff;color:#1a5f8d}.statement-status-complete{background:#e8f7f1;color:#176b50}.statement-offload-detail-row td{padding:0 7px 7px;background:#fafcfd}.statement-offload-detail-row details{border-left:2px solid #b7d4e1;padding:5px 8px}.statement-offload-detail-row summary{cursor:pointer;color:#426474;font-size:8px;font-weight:800}.statement-offload-detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}.statement-offload-detail div{background:#eef4f7;border-radius:6px;padding:6px}.statement-offload-detail span{display:block;color:#6a7f8a;font-size:7px;text-transform:uppercase;font-weight:800}.statement-offload-detail strong{font-size:8.5px}.statement-empty{padding:14px;border:1px solid #dce7ec;border-radius:9px;background:#f8fbfc;color:#607883;font-size:10px}.statement-print-notes{display:non const mascotLoaderInstances={
 data:window.CargoRunMascotLoader.create(document.getElementById('cargoLoaderMascot')),
 action:window.CargoRunMascotLoader.create(document.getElementById('actionLoaderMascot'))
};
const LOADER_REVEAL_DELAY_MS=140;
let cargoLoaderDepth=0,cargoLoaderTimer=null;
function revealLoader(el,mascot){
 el.classList.add('show');
 el.setAttribute('aria-hidden','false');
 mascot.show();
 document.body.setAttribute('aria-busy','true');
}
function concealLoader(el,mascot){
 el.classList.remove('show');
 el.setAttribute('aria-hidden','true');
 mascot.hide();
 if(!document.querySelector('.cargo-loader.show,.action-loader.show'))document.body.removeAttribute('aria-busy');
}
function showDataLoader(title='Loading live operations…',sub='Connecting to CargoRun'){
 const el=document.getElementById('cargoLoader');
 if(!el)return;
 cargoLoaderDepth++;
 const t=document.getElementById('cargoLoaderTitle'),s=document.getElementById('cargoLoaderSub');
 if(t)t.textContent=title;
 if(s)s.textContent=sub;
 if(cargoLoaderDepth===1&&!el.classList.contains('show'))cargoLoaderTimer=setTimeout(()=>{cargoLoaderTimer=null;if(cargoLoaderDepth>0)revealLoader(el,mascotLoaderInstances.data)},LOADER_REVEAL_DELAY_MS);
}
function updateDataLoader(title,sub){
 const t=document.getElementById('cargoLoaderTitle'),s=document.getElementById('cargoLoaderSub');
 if(title&&t)t.textContent=title;
 if(sub&&s)s.textContent=sub;
}
function hideDataLoader(force=false){
 const el=document.getElementById('cargoLoader');
 if(!el)return;
 cargoLoaderDepth=force?0:Math.max(0,cargoLoaderDepth-1);
 if(cargoLoaderDepth===0){if(cargoLoaderTimer!==null){clearTimeout(cargoLoaderTimer);cargoLoaderTimer=null}concealLoader(el,mascotLoaderInstances.data)}
}

function manifestDiscrepancyBadge(f,u,type){return type==='exports'&&f?.exportManifestFinal&&!u?.isFinalManifestMember?'<span class="not-on-final">NOT ON FINAL</span>':''}
function manifestFinalNote(f){const final=f?.exportManifestFinal;if(!final)return '';return `<div class="manifest-final-note"><strong>FINAL</strong> • Confirmed ${final.confirmedAtUtc?fmtDateTime(toMs(final.confirmedAtUtc)):'time unavailable'}${final.confirmedByDisplayName?` • ${esc(final.confirmedByDisplayName)}`:''}. Expected build membership is locked; operational ULD statuses remain live.</div>`}
function flightBoardState(f,type){const done=counts(f,type);if(type==='exports'&&done.done===done.total&&!f.closed)return {level:'green',label:'Finalise',cls:'clear'};if(type==='imports'){const sla=flightAcceptanceSummary(f);if(sla.late)return {level:'red',label:'Acceptance Late',cls:'urgent'};if(sla.warn)return {level:'amber',label:'Acceptance',cls:'watch'};const pending=f.ulds.filter(u=>u.status!=='Received');const high=pending.some(u=>uldPriorityClass(f,u,'imports')==='critical');const priority=pending.some(u=>uldPriorityClass(f,u,'imports')==='priority');if(high)return {level:'red',label:'High Priority',cls:'urgent'};if(priority)return {level:'amber',label:'Priority',cls:'watch'};if(pending.length)return {level:'amber',label:'Active',cls:'watch'};return {level:'green',label:'Complete',cls:'clear'}}if(done.done<done.total)return {level:'amber',label:'Loading',cls:'watch'};return {level:'green',label:'Complete',cls:'clear'}}
function flightBoardFlightMeta(f,type){const catalog=catalogFlightById(stableOperationalId(f?.azureFlightId))||{},origin=String(catalog.originAirport||f?.originAirport||'').trim().toUpperCase(),destination=String(catalog.destinationAirport||f?.destinationAirport||'').trim().toUpperCase();return {route:type==='imports'?(origin?`${origin} → MEL`:'Inbound to MEL'):(destination?`MEL → ${destination}`:'Outbound from MEL'),date:String(f?.flightDate||azureDisplayDate(catalog.operatingDate)||'Date unavailable')}}
function flightBoardTiming(f,type){const fs=f?.flightStatus||{};if(type==='imports'){const inBlock=toMs(fs.inBlockAt||fs.actualIn),landed=toMs(fs.landedAt||fs.actualOn),eta=toMs(fs.estimatedArrival),sta=toMs(fs.scheduledArrival);if(inBlock)return {rank:0,ts:inBlock,label:'IN BLOCK',value:fmtTime(inBlock)};if(landed)return {rank:0,ts:landed,label:'LANDED',value:fmtTime(landed)};if(eta)return {rank:1,ts:eta,label:'ETA',value:fmtTime(eta)};if(sta)return {rank:1,ts:sta,label:'STA',value:fmtTime(sta)};return {rank:2,ts:Number.MAX_SAFE_INTEGER,label:'ARRIVAL',value:'Time unavailable'}}const etd=toMs(fs.estimatedDeparture||f?.estimatedDeparture),std=toMs(fs.scheduledDeparture||f?.scheduledDeparture);if(etd)return {rank:0,ts:etd,label:'ETD',value:fmtTime(etd)};if(std)return {rank:0,ts:std,label:'STD',value:fmtTime(std)};return {rank:1,ts:Number.MAX_SAFE_INTEGER,label:'DEPARTURE',value:'Time unavailable'}}
function flightBoardPriorityCount(f,type){return expectedUldsForFlight(f,type).filter(u=>priorityTagsFor(f,u,type).length>0).length}
function flightBoardOffloadCount(f){const flightId=stableOperationalId(f?.azureFlightId);return flightId?allOperationalOffloads().filter(o=>stableOperationalId(o.flightId)===flightId).length:0}
function flightBoardRows(type){return activeFlights(type).map(f=>({f,timing:flightBoardTiming(f,type)})).sort((a,b)=>a.timing.rank-b.timing.rank||a.timing.ts-b.timing.ts||String(a.f.azureFlightId||'').localeCompare(String(b.f.azureFlightId||''),undefined,{numeric:true}))}
function flightBoardCard(f,type,timing=flightBoardTiming(f,type)){const c=counts(f,type),outstanding=Math.max(0,c.total-c.done),priorityCount=flightBoardPriorityCount(f,type),offloads=type==='exports'?flightBoardOffloadCount(f):0,meta=flightBoardFlightMeta(f,type),stateClass=flightBoardState(f,type),tags=flightPriorityTags(f,type);return `<button type="button" class="flight-board-card ${stateClass.cls}" data-flight-id="${esc(f.azureFlightId||'')}" onclick="selectDesktopFlightByStableId('${type}','${esc(f.azureFlightId||'')}')">${airlineBadge(f.flight)}<span class="flight-board-card-main"><span class="flight-board-card-title"><strong>${esc(f.flight||'Flight unavailable')} ${type==='exports'?manifestStateBadge(f):''}</strong><time>${esc(timing.label)} ${esc(timing.value)}</time></span><span class="flight-board-route">${esc(meta.route)}<span class="flight-board-date">${esc(meta.date)}</span></span><span class="flight-board-card-metrics"><span class="flight-board-metric"><strong>${c.done} / ${c.total}</strong> ${type==='imports'?'received':'at aircraft'}</span><span class="flight-board-metric"><strong>${outstanding}</strong> outstanding</span><span class="flight-board-metric"><strong>${priorityCount}</strong> priority</span>${offloads?`<span class="flight-board-metric"><strong>${offloads}</strong> offloads</span>`:''}</span>${tags.length?`<span class="flight-board-card-priority"><span class="flight-board-card-priority-label">Priority</span>${priorityBadges(tags)}</span>`:''}</span></button>`}
function flightBoardColumn(type){const rows=flightBoardRows(type),label=type==='imports'?'Imports':'Exports';return `<section class="flight-board-column ops-panel" data-flight-board-column="${type}"><div class="flight-board-column-head"><h2>${label}</h2><span>${rows.length} ACTIVE</span></div><div class="flight-board-list">${rows.length?rows.map(({f,timing})=>flightBoardCard(f,type,timing)).join(''):`<div class="flight-board-empty">No active ${type}.</div>`}</div></section>`}
function liveFlightBoard(){return `<div class="flight-board-grid">${flightBoardColumn('imports')}${flightBoardColumn('exports')}</div>`}

function flightBoardScreen(){if(isMobileUI())return mobileFlightsHub();const rows=activeFlights('imports').length+activeFlights('exports').length;return `<div class="toolbar"><button class="back" onclick="openScreen('home')">← Home</button><div class="spacer"></div>${FLIGHTAWARE_ENABLED?`<button class="secondary" onclick="showFlightStatusSettings()">Arrival Settings</button><button class="secondary" onclick="syncAllFlightArrivals(false)">Sync Arrivals</button>`:''}<button class="secondary" onclick="openScreen('priority')">Priority Cargo</button><button class="primary" onclick="showScan()">Scan ULD</button></div><div class="ops-page-head flight-board-page-head"><div><h1>Live Flight Board</h1><p>Whole airside operation at a glance. Select a flight to open its exact operational workspace.</p></div><div class="manager-badge">${rows} ACTIVE FLIGHTS</div></div>${liveFlightBoard()}`}

function priorityCargoItems(){const out=[];const type='imports';for(const f of activeFlights('imports'))for(let i=0;i<f.ulds.length;i++){const u=f.ulds[i],tags=priorityTagsFor(f,u,type);if(!tags.length||u.status==='Received')continue;const critical=tags.some(t=>t.level==='critical');out.push({type,flightId:stableOperationalId(f.azureFlightId),flight:f.flight,uld:u.num,status:u.status,tags,handlingType:u.handlingType||'',weight:u.weight||null,level:critical?'critical':'priority',rank:critical?0:1})}return out.sort((a,b)=>a.rank-b.rank||a.flight.localeCompare(b.flight))}
function priorityCargoScreen(){if(isMobileUI())return mobilePriorityScreen(route.type==='detail'?route.id:'');const items=priorityCargoItems(),critical=items.filter(x=>x.level==='critical').length,priority=items.length-critical;return `<div class="toolbar"><button class="back" onclick="openScreen('home')">← Home</button><div class="spacer"></div><button class="secondary" onclick="openScreen('flightboard')">Live Flight Board</button><button class="primary" onclick="showScan()">Scan ULD</button></div><div class="screen-intro"><div><div class="screen-title">Inbound Priority Cargo</div><div class="screen-sub">Only operational priority categories are shown here: live animals, temperature-controlled/pharma cargo, priority mail for CX/UA, AOG, valuable cargo and human remains. Non-priority SHCs remain in the source data but are hidden from the operational view.</div><div class="ops-strip">${opsChip('Immediate',critical,critical?'red':'green')}${opsChip('Priority',priority,priority?'amber':'green')}${opsChip('Inbound total',items.length,items.length?'amber':'green')}</div></div><img class="mascot-mini" style="width:64px;height:64px" src="${CARGORUN_MASCOT}" alt="CargoRun mascot"></div><div class="priority-grid">${items.length?items.map(x=>`<div class="priority-row ${x.level}" data-flight-id="${esc(x.flightId)}" onclick="selectDesktopFlightByStableId('imports','${esc(x.flightId)}')"><div class="priority-level ${x.level}">${x.level==='critical'?'Immediate':'Priority'}</div><div class="priority-main"><strong>${esc(x.uld)}</strong><small>Inbound cargo${x.handlingType?` • ${esc(x.handlingType)}`:''}${x.weight?` • ${esc(formatWeight(x.weight))}`:''}</small></div><div class="priority-shcs">${priorityBadges(x.tags)}</div><div class="priority-flight">${airlineBadge(x.flight)}<div><strong>${esc(x.flight)}</strong><div class="priority-direction">IMPORT • TO WAREHOUSE</div></div></div><div class="priority-status">${esc(x.status)}<small>Open import flight</small></div></div>`).join(''):`<div class="empty"><img class="mascot-empty" src="${CARGORUN_MASCOT}" alt="CargoRun mascot">No outstanding inbound priority cargo.</div>`}</div>`}
function handlingCounts(f){return {intact:f.ulds.filter(u=>u.handlingType==='INTACT').length,breakdown:f.ulds.filter(u=>u.handlingType==='BREAKDOWN').length}}
function ageMinutes(ts){return Math.max(0,Math.floor((Date.now()-ts)/60000))}
function flightStatusSettings(){return state.settings?.flightStatus||seed.settings.flightStatus}
function toMs(v){if(!v)return null;if(typeof v==='number')return v>1e12?v:v*1000;const n=Date.parse(v);return Number.isFinite(n)?n:null}
function flightDateISO(f){const raw=String(f?.flightDate||'').trim();if(!raw)return new Date().toISOString().slice(0,10);let m;if((m=raw.match(/(\d{1,2})[-\/]([A-Za-z]{3}|\d{1,2})[-\/](\d{4})/))){const d=Number(m[1]),y=Number(m[3]);const months={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};const mon=/^[A-Za-z]/.test(m[2])?months[m[2].slice(0,3).toUpperCase()]:Number(m[2])-1;if(Number.isFinite(mon))return `${y}-${String(mon+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}if((m=raw.match(/(\d{1,2})([A-Za-z]{3})(\d{4})/))){const months={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};return `${m[3]}-${months[m[2].toUpperCase()]||'01'}-${String(m[1]).padStart(2,'0')}`;}const parsed=Date.parse(raw);return Number.isFinite(parsed)?new Date(parsed).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}
function arrivalTimerStart(f){const fs=f?.flightStatus||{};const inBlock=toMs(fs.inBlockAt||fs.actualIn);if(inBlock)return {ts:inBlock,basis:'In block'};const landed=toMs(fs.landedAt||fs.actualOn);if(landed){const grace=Number(flightStatusSettings().landingGraceMinutes||0);return {ts:landed+grace*60000,basis:`Landed + ${grace}m grace`}}return null}
function acceptanceThresholds(f,u){const s=flightStatusSettings(),priority=uldPriorityClass(f,u,'imports')!=='standard';return priority?{warn:Number(s.priorityWarnMinutes),late:Number(s.priorityLateMinutes),priority:true}:{warn:Number(s.standardWarnMinutes),late:Number(s.standardLateMinutes),priority:false}}
function acceptanceSla(f,u){const start=arrivalTimerStart(f);if(!start)return {level:'none',minutes:null,start:null,basis:''};const end=u.acceptedAt?toMs(u.acceptedAt):Date.now();const minutes=Math.max(0,Math.floor((end-start.ts)/60000));const t=acceptanceThresholds(f,u);let level='ok';if(!u.acceptedAt&&minutes>=t.late)level='late';else if(!u.acceptedAt&&minutes>=t.warn)level='warn';return {level,minutes,start:start.ts,basis:start.basis,priority:t.priority,accepted:!!u.acceptedAt}}
function flightAcceptanceSummary(f){let late=0,warn=0;for(const u of f.ulds||[]){if(u.status!=='Unarrived')continue;const s=acceptanceSla(f,u);if(s.level==='late')late++;else if(s.level==='warn')warn++;}return {late,warn,total:late+warn}}
function acceptanceBadge(f,u){if(u.status!=='Unarrived'&&!u.acceptedAt)return '';const s=acceptanceSla(f,u);if(s.minutes===null)return '';if(u.acceptedAt)return `<span class="acceptance-age ok">Accepted ${s.minutes}m after arrival</span>`;if(s.level==='late')return `<span class="acceptance-age late">Acceptance late • ${s.minutes}m</span>`;if(s.level==='warn')return `<span class="acceptance-age warn">Acceptance warning • ${s.minutes}m</span>`;return `<span class="acceptance-age ok">Acceptance timer • ${s.minutes}m</span>`}
function arrivalSummaryHtml(f){const fs=f.flightStatus||{},start=arrivalTimerStart(f),sla=flightAcceptanceSummary(f);let label='Arrival not synced',cls='offline';if(toMs(fs.inBlockAt||fs.actualIn)){label=`In block ${fmtTime(toMs(fs.inBlockAt||fs.actualIn))}`;cls=sla.late?'late':sla.warn?'warn':'live'}else if(toMs(fs.landedAt||fs.actualOn)){label=`Landed ${fmtTime(toMs(fs.landedAt||fs.actualOn))}`;cls=sla.late?'late':sla.warn?'warn':'live'}else if(toMs(fs.estimatedArrival)){label=`ETA ${fmtTime(toMs(fs.estimatedArrival))}`;cls='offline'}return `<div class="arrival-line"><span class="arrival-pill ${cls}">${esc(label)}</span>${start?`<span>${Math.max(0,ageMinutes(start.ts))}m since timer start</span>`:''}${fs.provider?`<span>${esc(fs.provider)}</span>`:''}</div>`}
function localDateTimeValue(ts=Date.now()){const d=new Date(ts),off=d.getTimezoneOffset()*60000;return new Date(d.getTime()-off).toISOString().slice(0,16)}
function canUseFlightStatusApi(){return FLIGHTAWARE_ENABLED&&(location.protocol==='http:'||location.protocol==='https:')}
async function syncFlightArrivalById(id,quiet=false){if(!FLIGHTAWARE_ENABLED)return false;const generation=operationalSessionGeneration,f=state.imports.find(x=>x.id===id),flightId=stableOperationalId(f?.azureFlightId);if(!f||f.closed||!flightId||!operationalSessionIsCurrent(generation))return false;const s=flightStatusSettings();if(!canUseFlightStatusApi()){if(!quiet)toast('Live arrival sync activates once CargoRun is hosted in Azure. Manual In Block works now.');return false}try{const qs=new URLSearchParams({flightId});const res=await fetch(`${s.endpoint||'/api/flight-status'}?${qs}`,{headers:{Accept:'application/json','X-CargoRun-FlightAware-Enabled':String(FLIGHTAWARE_ENABLED)}});let data={};try{data=await res.json()}catch{}if(!operationalSessionIsCurrent(generation))return false;if(!res.ok)throw new Error(data.error||`Flight status ${res.status}`);f.flightStatus={...(f.flightStatus||{}),provider:data.provider||'FlightAware AeroAPI',status:data.status||'',scheduledArrival:data.scheduledArrival||null,estimatedArrival:data.estimatedArrival||null,landedAt:data.landedAt||null,inBlockAt:data.inBlockAt||null,lastChecked:Date.now(),matchedFlight:data.matchedFlight||f.flight,source:'azure'};logEvent('Flight','Arrival status synced',{flight:f.flight,detail:`${f.flightStatus.inBlockAt?'In block '+fmtDateTime(toMs(f.flightStatus.inBlockAt)):f.flightStatus.landedAt?'Landed '+fmtDateTime(toMs(f.flightStatus.landedAt)):'Flight status updated'}`,user:'CargoRun'});save();if(!quiet){toast(`${f.flight} arrival status updated`);render()}return true}catch(err){if(!operationalSessionIsCurrent(generation))return false;f.flightStatus={...(f.flightStatus||{}),lastChecked:Date.now(),lastError:err.message||'Flight status unavailable'};save();if(!quiet)toast(`${f.flight}: ${err.message||'flight status unavailable'}`);return false}}
async function syncAllFlightArrivals(quiet=false){if(!FLIGHTAWARE_ENABLED)return false;const generation=operationalSessionGeneration,flights=activeFlights('imports');if(!flights.length||!operationalSessionIsCurrent(generation))return false;let ok=0;for(const f of flights){if(await syncFlightArrivalById(f.id,true))ok++;if(!operationalSessionIsCurrent(generation))return false}if(!quiet){toast(ok?`Arrival status updated for ${ok}/${flights.length} import flights`:'No live arrival statuses updated');render()}return ok>0}
function showSetInBlock(id){if(!canUseStationAction('setInBlock'))return false;const f=state.imports.find(x=>x.id===id);if(!f)return;modal(`${modalHead('Set Aircraft In Block')}<p>Fallback for when the external flight-status feed is unavailable. This time starts CargoRun's ULD acceptance timers.</p><div class="field"><label>IN BLOCK TIME</label><input id="manualInBlock" type="datetime-local" value="${localDateTimeValue()}"></div><div class="accept-note">The record will show that the time was manually entered and who entered it.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveManualInBlock('${id}')">Start Timers</button></div>`)}
async function saveManualInBlock(id){const generation=operationalSessionGeneration,f=state.imports.find(x=>x.id===id),v=document.getElementById('manualInBlock')?.value;if(!f||!v||!f.azureFlightId||!operationalSessionIsCurrent(generation))return;const ts=new Date(v).getTime();if(!Number.isFinite(ts)){toast('Enter a valid time');return}showActionLoader('Saving In Block…',f.flight);try{const inBlockAtUtc=new Date(ts).toISOString(),res=await fetch('/api/flights',{method:'PATCH',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({flightId:f.azureFlightId,inBlockAtUtc})}),data=await res.json().catch(()=>({}));if(!operationalSessionIsCurrent(generation))return;if(!res.ok||data.ok===false)throw new Error(data.error||data.detail||`Flights API ${res.status}`);f.flightStatus={...(f.flightStatus||{}),provider:'Manual',inBlockAt:inBlockAtUtc,landedAt:f.flightStatus?.landedAt||null,lastChecked:Date.now(),source:'manual',manualBy:currentUser().name};logEvent('Flight','In block set manually',{flight:f.flight,detail:`In block ${fmtDateTime(ts)}`,user:currentUser().name,persist:false});save();closeModal();toast(`${f.flight} acceptance timers started`);render()}catch(err){if(!operationalSessionIsCurrent(generation))return;console.error(err);toast(err?.message||'In Block could not be saved')}finally{if(operationalSessionIsCurrent(generation))hideActionLoader()}}
function showFlightStatusSettings(){const s=flightStatusSettings(),available=canUseFlightStatusApi(),status=FLIGHTAWARE_ENABLED?(available?'Azure-hosted mode available':'Local prototype mode'):'Live tracking disabled',detail=FLIGHTAWARE_ENABLED?(available?'Use Sync Arrivals to query the configured Azure endpoint.':'Open this version locally for UI testing. Live API calls begin after Azure deployment; use manual In Block timestamps in the meantime.'):'Existing arrival data and manual In Block remain available. No FlightAware requests will be made.';modal(`${modalHead('Flight Arrival Integration')}<p>CargoRun calls an Azure Function at <strong>${esc(s.endpoint)}</strong>. The Azure Function keeps the FlightAware API key server-side and returns scheduled, estimated, landed and in-block times.</p><div class="integration-card"><strong>${status}</strong><small>${detail}</small></div><div class="field"><label>STANDARD WARNING / LATE (MIN)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="stdWarn" type="number" min="1" value="${s.standardWarnMinutes}"><input id="stdLate" type="number" min="1" value="${s.standardLateMinutes}"></div></div><div class="field"><label>PRIORITY WARNING / LATE (MIN)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="priWarn" type="number" min="1" value="${s.priorityWarnMinutes}"><input id="priLate" type="number" min="1" value="${s.priorityLateMinutes}"></div></div><div class="field"><label>LANDING-TO-IN-BLOCK FALLBACK GRACE (MIN)</label><input id="landGrace" type="number" min="0" value="${s.landingGraceMinutes}"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveFlightStatusSettings()">Save</button></div>`)}
function saveFlightStatusSettings(){const s=flightStatusSettings();s.standardWarnMinutes=Math.max(1,Number(document.getElementById('stdWarn').value)||20);s.standardLateMinutes=Math.max(s.standardWarnMinutes,Number(document.getElementById('stdLate').value)||30);s.priorityWarnMinutes=Math.max(1,Number(document.getElementById('priWarn').value)||10);s.priorityLateMinutes=Math.max(s.priorityWarnMinutes,Number(document.getElementById('priLate').value)||20);s.landingGraceMinutes=Math.max(0,Number(document.getElementById('landGrace').value)||0);state.settings.flightStatus=s;save();closeModal();toast('Arrival warning settings saved');render()}

function toneClass(level){return level==='red'?'alert':level==='amber'?'warn':'good'}
function statusPill(label,level){return `<span class="state-badge ${toneClass(level)}">${esc(label)}</span>`}
function opsChip(label,num,level){return `<span class="ops-chip ${level}">${esc(label)} <span class="num">${num}</span></span>`}
function importsUrgencySummary(){
 const flights=activeFlights('imports');
 let red=0, amber=0;
 flights.forEach(f=>{const pending=f.ulds.filter(u=>u.status!=='Received'),sla=flightAcceptanceSummary(f);const high=pending.some(u=>uldPriorityClass(f,u,'imports')==='critical'),priority=pending.some(u=>uldPriorityClass(f,u,'imports')==='priority');if(sla.late||high)red++;else if(sla.warn||priority||pending.filter(u=>u.status==='Unarrived').length>=2)amber++;else if(pending.length)amber++;});
 return red?{level:'red',cls:'alert',label:'Urgent',detail:`${red} import flight${red===1?'':'s'} need attention`}:amber?{level:'amber',cls:'warn',label:'Watch',detail:`${amber} import flight${amber===1?'':'s'} in progress`}:{level:'green',cls:'good',label:'Clear',detail:'All active imports under control'};
}
function exportsUrgencySummary(){
 const flights=activeFlights('exports');
 let amber=flights.filter(f=>expectedUldsForFlight(f,'exports').some(u=>u.status!=='At Aircraft')).length;
 return amber?{level:'amber',cls:'warn',label:'Active',detail:`${amber} export flight${amber===1?'':'s'} still loading`}:{level:'green',cls:'good',label:'Clear',detail:'No export issues'};
}
function offloadUrgencySummary(){
 const critical=state.offloads.filter(o=>ageMinutes(o.requestedAt)>=10).length;
 if(critical)return {level:'red',cls:'alert',label:'Urgent',detail:`${critical} offload${critical===1?'':'s'} waiting >10 min`};
 if(state.offloads.length)return {level:'amber',cls:'warn',label:'Active',detail:`${state.offloads.length} offload${state.offloads.length===1?'':'s'} outstanding`};
 return {level:'green',cls:'good',label:'Clear',detail:'No outstanding offloads'};
}
function overallUrgencySummary(){
 const alerts=supervisorAlerts(); const critical=alerts.filter(a=>a.level==='red').length; const amber=alerts.length-critical;
 if(critical)return {level:'red',cls:'alert',label:'Critical',text:`${critical} critical item${critical===1?'':'s'} need attention`,critical,amber};
 if(amber)return {level:'amber',cls:'warn',label:'Watch',text:`${amber} operational item${amber===1?'':'s'} to watch`,critical,amber};
 return {level:'green',cls:'good',label:'Clear',text:'Operation is clear',critical:0,amber:0};
}

function allActiveUlds(){return [...activeFlights('imports').flatMap(f=>f.ulds.map(u=>({...u,flight:f.flight,type:'imports',flightId:f.id}))),...activeFlights('exports').flatMap(f=>f.ulds.map(u=>({...u,flight:f.flight,type:'exports',flightId:f.id})))]}
function recentEvents(n=6){return (state.history||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,n)}
function eventDescription(e){let bits=[];if(e.flight)bits.push(e.flight);if(e.uld)bits.push(e.uld);let context=bits.join(' • ');let change=e.from&&e.to?`${e.from} → ${e.to}`:'';return [context,change,e.detail].filter(Boolean).join(' — ')}
function activityRows(events){return events.length?events.map(e=>`<div class="activity-item"><div><strong>${esc(e.action)}</strong><small>${esc(eventDescription(e)||e.type)}</small></div><time>${fmtTime(e.ts)}</time></div>`).join(''):`<div class="empty">No activity recorded yet.</div>`}

function operationalOffloadRequestedAt(o){return toMs(o?.requestedAtKnown)||(!stableOperationalId(o?.azureOffloadId)?toMs(o?.requestedAt):0)}
function compareOperationalOffloads(a,b){const at=operationalOffloadRequestedAt(a),bt=operationalOffloadRequestedAt(b);if(at&&bt&&at!==bt)return at-bt;if(at&&!bt)return -1;if(!at&&bt)return 1;return String(a?.azureOffloadId??'').localeCompare(String(b?.azureOffloadId??''),undefined,{numeric:true})}

function operationalOffloadCounts(){const all=allOperationalOffloads();return {Active:all.filter(o=>o.status==='Requested'||o.status==='Transit').length,Completed:all.filter(o=>o.status==='Complete').length,All:all.length}}
function filteredOperationalOffloads(){const all=allOperationalOffloads();if(offloadQueueFilter==='Active')return all.filter(o=>o.status==='Requested'||o.status==='Transit');if(offloadQueueFilter==='Completed')return all.filter(o=>o.status==='Complete');return all}

async function loadMachFowRecent(silent=true){const generation=operationalSessionGeneration;if(machFowLoading||!operationalSessionIsCurrent(generation))return;machFowLoading=true;try{const res=await fetch(selectedStationApiUrl('/api/mach-fow'),{headers:{Accept:'application/json'},cache:'no-store'}),data=await res.json().catch(()=>({}));if(!operationalSessionIsCurrent(generation))return;if(!res.ok||data.ok===false)throw new Error(data.error||`MACH FOW API ${res.status}`);machFowRecent=Array.isArray(data.messages)?data.messages:[];machFowReceiver=data.receiver||null;machFowLoaded=true;if(route.screen==='machfow')render()}catch(err){if(!operationalSessionIsCurrent(generation))return;console.error(err);if(!silent)toast(err?.message||'Could not load FOW message log')}finally{if(operationalSessionIsCurrent(generation))machFowLoading=false}}
async function processMachFow(){
  if(!canUseStationAction('uploadFlightData'))return false;
  const generation=operationalSessionGeneration;
  const xml=(document.getElementById('machFowXml')?.value||'').trim();
  if(!xml||!operationalSessionIsCurrent(generation)){if(!xml)toast('Paste a FOW XML message first');return}
  showActionLoader('Processing MACH FOW…','Checking flight and unique ULDs');
  try{
    const res=await fetch('/api/mach-fow',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({xml,source:'SIMULATOR'})});
    const data=await res.json().catch(()=>({}));
    if(!operationalSessionIsCurrent(generation))return;
    if(!res.ok||data.ok===false)throw new Error(data.error||data.detail||`MACH FOW API ${res.status}`);
    const ulds=(data.ulds||[]).map(x=>typeof x==='string'?x:x.uldNumber).filter(Boolean);

    if(data.duplicate){
      logEvent('System','MACH FOW duplicate ignored',{flight:data.flightNumber||'',uld:ulds.length===1?ulds[0]:'',detail:`Exact FOW message already received • ${ulds.length} ULD${ulds.length===1?'':'s'} • no operational change`,user:currentUser().name});
      await syncCentralData(true);
      if(!operationalSessionIsCurrent(generation))return;
      await loadMachFowRecent(true);
      if(!operationalSessionIsCurrent(generation))return;
      toast(`Duplicate FOW ignored • ${data.flightNumber||'Flight'}`);
      openScreen('machfow');
      return;
    }

    const newCount=Number(data.newUldCount ?? (data.ulds||[]).filter(x=>typeof x==='object'&&x.created===true).length);
    const existingCount=Number(data.existingUldCount ?? (data.ulds||[]).filter(x=>typeof x==='object'&&x.created===false).length);
    let eventDetail='';
    let toastMessage='';

    if(newCount>0 && existingCount===0){
      eventDetail=`${newCount} new ULD${newCount===1?'':'s'} created${data.createdFlight?' • flight created':' • existing flight'}`;
      toastMessage=`${data.flightNumber||'Flight'} • ${newCount} new ULD${newCount===1?'':'s'} added`;
    }else if(newCount===0 && existingCount>0){
      eventDetail=`${existingCount} ULD${existingCount===1?'':'s'} already on flight • FOW recorded • no operational ULD change`;
      toastMessage=`${data.flightNumber||'Flight'} • ${existingCount===1?'ULD already exists':'ULDs already exist'} • no change`;
    }else if(newCount>0 && existingCount>0){
      eventDetail=`${newCount} new ULD${newCount===1?'':'s'} created • ${existingCount} existing ULD${existingCount===1?'':'s'} reused`;
      toastMessage=`${data.flightNumber||'Flight'} • ${newCount} new • ${existingCount} existing`;
    }else{
      eventDetail=`FOW processed • ${ulds.length} ULD${ulds.length===1?'':'s'} referenced`;
      toastMessage=`${data.flightNumber||'Flight'} • FOW processed`;
    }

    logEvent('System','MACH FOW processed',{flight:data.flightNumber||'',uld:ulds.length===1?ulds[0]:'',detail:eventDetail,user:currentUser().name});
    await syncCentralData(true);
    if(!operationalSessionIsCurrent(generation))return;
    await loadMachFowRecent(true);
    if(!operationalSessionIsCurrent(generation))return;
    toast(toastMessage);
    openScreen('machfow');
  }catch(err){
    if(!operationalSessionIsCurrent(generation))return;
    console.error(err);
    toast(err?.message||'FOW could not be processed');
  }finally{
    if(operationalSessionIsCurrent(generation))hideActionLoader();
  }
}

function xU16(v, o) {
  return v.getUint16(o, true);
}


function xU32(v, o) {
  return v.getUint32(o, true);
}


async function unzipXlsxEntries(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);

  let eocd = -1;

  for (
    let i = bytes.length - 22;
    i >= Math.max(0, bytes.length - 66000);
    i--
  ) {
    if (xU32(view, i) === 0x06054b50) {
      eocd = i;
      break;
    }
  }

  if (eocd < 0) {
    throw new Error(
      'This does not appear to be a valid .xlsx file.'
    );
  }

  const total = xU16(view, eocd + 10);
  const cdOffset = xU32(view, eocd + 16);
  const td = new TextDecoder('utf-8');

  if (total > CARGORUN_XLSX_MAX_ENTRIES) {
    throw new Error('The Excel file contains too many internal entries.');
  }

  const entries = {};
  let totalUncompressed = 0;

  let p = cdOffset;

  for (let n = 0; n < total; n++) {
    if (xU32(view, p) !== 0x02014b50) {
      throw new Error('Invalid Excel file directory.');
    }

    const method = xU16(view, p + 10);
    const compSize = xU32(view, p + 20);
    const uncompSize = xU32(view, p + 24);
    const fnLen = xU16(view, p + 28);
    const extraLen = xU16(view, p + 30);
    const commentLen = xU16(view, p + 32);
    const localOff = xU32(view, p + 42);

    totalUncompressed += uncompSize;
    if (totalUncompressed > CARGORUN_XLSX_MAX_UNCOMPRESSED_BYTES) {
      throw new Error('The expanded Excel file is too large.');
    }

    const name = td.decode(
      bytes.slice(
        p + 46,
        p + 46 + fnLen
      )
    );

    entries[name] = {
      method,
      compSize,
      uncompSize,
      localOff
    };

    p += 46 + fnLen + extraLen + commentLen;
  }

  async function read(name) {
    const e = entries[name];

    if (!e) {
      return null;
    }

    const lo = e.localOff;

    if (xU32(view, lo) !== 0x04034b50) {
      throw new Error('Invalid Excel file entry.');
    }

    const fnLen = xU16(view, lo + 26);
    const extraLen = xU16(view, lo + 28);

    const start =
      lo +
      30 +
      fnLen +
      extraLen;

    const comp = bytes.slice(
      start,
      start + e.compSize
    );

    if (e.method === 0) {
      return comp;
    }

    if (e.method === 8) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error(
          'Excel upload requires a modern Chrome or Edge browser.'
        );
      }

      const ds =
        new DecompressionStream('deflate-raw');

      const stream =
        new Blob([comp])
          .stream()
          .pipeThrough(ds);

      return new Uint8Array(
        await new Response(stream).arrayBuffer()
      );
    }

    throw new Error(
      'Unsupported Excel compression method.'
    );
  }

  return {
    entries,
    read
  };
}


function decodeXlsxXml(s) {
  return String(s || '')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}


function xlsxColIndex(ref = 'A1') {
  let n = 0;

  const letters =
    (ref.match(/[A-Z]+/i) || ['A'])[0]
      .toUpperCase();

  for (const ch of letters) {
    n =
      n * 26 +
      (ch.charCodeAt(0) - 64);
  }

  return n - 1;
}


function parseSharedStrings(xml = '') {
  const out = [];

  let m;

  const si =
    /<si\b[^>]*>([\s\S]*?)<\/si>/gi;

  while ((m = si.exec(xml))) {
    let t = '';
    let tm;

    const tr =
      /<t\b[^>]*>([\s\S]*?)<\/t>/gi;

    while ((tm = tr.exec(m[1]))) {
      t += decodeXlsxXml(tm[1]);
    }

    out.push(t);
  }

  return out;
}


function parseSheetRows(xml, shared = []) {
  const rows = [];

  let rm;

  const rr =
    /<row\b[^>]*>([\s\S]*?)<\/row>/gi;

  while ((rm = rr.exec(xml))) {
    const row = [];

    let cm;

    const cr =
      /<c\b([^>]*)>([\s\S]*?)<\/c>/gi;

    while ((cm = cr.exec(rm[1]))) {
      const attrs = cm[1];
      const body = cm[2];

      const ref =
        (attrs.match(/\br="([^"]+)"/) || [])[1] ||
        'A1';

      const t =
        (attrs.match(/\bt="([^"]+)"/) || [])[1] ||
        '';

      let val = '';

      if (t === 'inlineStr') {
        let tm;

        const tr =
          /<t\b[^>]*>([\s\S]*?)<\/t>/gi;

        while ((tm = tr.exec(body))) {
          val += decodeXlsxXml(tm[1]);
        }
      } else {
        const vm =
          body.match(
            /<v\b[^>]*>([\s\S]*?)<\/v>/i
          );

        if (vm) {
          val = decodeXlsxXml(vm[1]);

          if (t === 's') {
            val =
              shared[Number(val)] ??
              val;
          } else if (
            t === 'n' ||
            t === ''
          ) {
            const num = Number(val);

            if (Number.isFinite(num)) {
              val = num;
            }
          }
        }
      }

      row[xlsxColIndex(ref)] = val;
    }

    rows.push(row);
  }

  return rows;
}


function xlsxSplitShcs(v) {
  return String(v || '')
    .split(/[,\s]+/)
    .map(x =>
      x
        .trim()
        .toUpperCase()
    )
    .filter(Boolean);
}


function xlsxHeader(v) {
  return String(v || '')
    .replace(/\s+/g, ' ')
    .trim()
    .toUpperCase();
}


function xlsxFindHeader(headers, names) {
  for (
    let i = 0;
    i < headers.length;
    i++
  ) {
    const h =
      xlsxHeader(headers[i]);

    if (
      names.some(n =>
        h.includes(n)
      )
    ) {
      return i;
    }
  }

  return -1;
}


function parseCargoRunRows(
  rows,
  filename = ''
) {
  const top =
    (rows[0] || [])
      .map(x =>
        String(x ?? '')
      )
      .join(' | ')
      .toUpperCase();

  let type = null;

  if (
    /IMPORT\s+ULD\s+(LIST|SUMMARY)/.test(top)
  ) {
    type = 'imports';
  } else if (
    /EXPORT\s+UNIT\s+LIST/.test(top) ||
    /EXPORT\s+ULD\s+LIST/.test(top)
  ) {
    type = 'exports';
  } else {
    throw new Error(
      'CargoRun could not detect Import or Export. ' +
      'The top of the sheet must say “Import ULD List” ' +
      'or “Export Unit List”.'
    );
  }

  const allTop =
    rows
      .slice(0, 2)
      .flat()
      .map(x =>
        String(x ?? '')
      )
      .join(' | ');

  let flight = '';
  let flightDate = '';

  if (type === 'imports') {
    const m =
      allTop.match(
        /Import\s+ULD\s+(?:List|Summary)\s*\(\s*([A-Z0-9]+)\s+([^\)]+)\)/i
      );

    if (m) {
      flight =
        m[1].toUpperCase();

      flightDate =
        m[2].trim();
    }

  } else {
    const fm =
      allTop.match(
        /Flight\s*Number\s*:\s*([A-Z0-9]+)/i
      );

    const dm =
      allTop.match(
        /Date\s*:\s*([^|]+)/i
      );

    if (fm) {
      flight =
        fm[1].toUpperCase();
    }

    if (dm) {
      flightDate =
        dm[1].trim();
    }
  }

  if (!flight) {
    const fm =
      filename.match(
        /(?:ImportULDList_|Export_ULD_List_)([A-Z0-9]+)/i
      );

    if (fm) {
      flight =
        fm[1].toUpperCase();
    }
  }

  if (!flight) {
    throw new Error(
      'Flight number could not be read from the worksheet.'
    );
  }

  const headerRowIndex =
    rows.findIndex(r =>
      (r || []).some(c =>
        /ULD\s*(NUMBER|NUMBER\s*\/\s*BULK)/i
          .test(
            String(c || '')
          )
      )
    );

  if (headerRowIndex < 0) {
    throw new Error(
      'CargoRun could not find the ULD header row.'
    );
  }

  const headers =
    rows[headerRowIndex] || [];

  const uldCol =
    xlsxFindHeader(
      headers,
      [
        'ULD NUMBER / BULK',
        'ULD NUMBER'
      ]
    );

  const shcCol =
    xlsxFindHeader(
      headers,
      ['SHC']
    );

  const unitTypeCol =
    xlsxFindHeader(
      headers,
      ['ULD TYPE']
    );

  const weightCol =
    xlsxFindHeader(
      headers,
      type === 'imports'
        ? ['MANIFEST WEIGHT']
        : ['GROSS WEIGHT']
    );

  const contourCol =
    xlsxFindHeader(
      headers,
      ['CONTOUR']
    );

  const remarksCol =
    xlsxFindHeader(
      headers,
      ['ULD REMARKS']
    );

  const priorityCol =
    xlsxFindHeader(
      headers,
      ['PRIORITY']
    );

  if (uldCol < 0) {
    throw new Error(
      'ULD Number column was not found.'
    );
  }

  const ulds = [];

  for (
    const row of
    rows.slice(
      headerRowIndex + 1
    )
  ) {
    const num = normalizeULD(row[uldCol]);

    if (
      !num ||
      !/[A-Z]/.test(num) ||
      !/\d/.test(num)
    ) {
      continue;
    }

    const handling =
      type === 'imports' &&
      unitTypeCol >= 0
        ? String(
            row[unitTypeCol] ?? ''
          )
            .trim()
            .toUpperCase()
        : '';

    const rawWeight =
      weightCol >= 0
        ? Number(
            row[weightCol]
          )
        : NaN;

    const handlingType =
      handling.includes('BREAKDOWN')
        ? 'BREAKDOWN'
        : handling.includes('INTACT')
          ? 'INTACT'
          : '';

    ulds.push({
      num,

      shcs:
        shcCol >= 0
          ? xlsxSplitShcs(
              row[shcCol]
            )
          : [],

      status:
        type === 'imports'
          ? 'Unarrived'
          : 'Warehouse',

      handlingType,

      rawHandling:
        handling,

      weight:
        Number.isFinite(
          rawWeight
        )
          ? rawWeight
          : null,

      contour:
        contourCol >= 0
          ? String(
              row[contourCol] ?? ''
            ).trim()
          : '',

      remarks:
        remarksCol >= 0
          ? String(
              row[remarksCol] ?? ''
            ).trim()
          : '',

      priority:
        priorityCol >= 0
          ? String(
              row[priorityCol] ?? ''
            ).trim()
          : ''
    });
  }

  if (!ulds.length) {
    throw new Error(
      'No ULD records were found in the file.'
    );
  }

  return {
    type,
    flight,
    flightDate,
    ulds,
    sourceFile: filename
  };
}


function detectCargoRunWorkbook(workbook) {
  let uwsMarker = false;
  let uwsSection = false;
  let uwsHeader = false;
  let importTitle = false;
  let exportTitle = false;
  let standardHeader = false;

  for (const sheet of workbook.sheets || []) {
    for (const row of sheet.rows || []) {
      const headers = (row || []).map(xlsxHeader);
      const joined = headers.join(' | ');
      if (joined.includes('ULD/BULK LOAD WEIGHT STATEMENT')) uwsMarker = true;
      if (joined.includes('UNIT LOAD DEVICES(ULD)')) uwsSection = true;
      if (headers.includes('NUMBER') && headers.includes('UNLOAD STATION') && headers.includes('PCS') && headers.includes('GROSS WEIGHT')) uwsHeader = true;
      if (/IMPORT\s+ULD\s+(LIST|SUMMARY)/.test(joined)) importTitle = true;
      if (/EXPORT\s+(UNIT|ULD)\s+LIST/.test(joined)) exportTitle = true;
      if (headers.some(value => value === 'ULD NUMBER' || value === 'ULD NUMBER / BULK')) standardHeader = true;
    }
  }

  const matches = [];
  if (uwsMarker && uwsSection && uwsHeader) matches.push('EXPORT_UWS');
  if (importTitle && standardHeader) matches.push('IMPORT_ULD_SUMMARY');
  if (exportTitle && standardHeader) matches.push('EXPORT_UNIT_LIST');
  if (matches.length > 1) throw new Error('Workbook structure is ambiguous. CargoRun has not selected a workflow.');
  if (!matches.length) throw new Error('CargoRun could not identify a supported workbook from its structure.');
  return matches[0];
}

async function readCargoRunWorkbook(file) {
  if (!file || !/\.xlsx$/i.test(file.name || '') || file.type && file.type !== 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
    throw new Error('Select a valid .xlsx workbook.');
  }
  if (Number(file.size) > CARGORUN_XLSX_MAX_BYTES) {
    throw new Error('The Excel file exceeds the 8 MB CargoRun limit.');
  }
  const arr = await file.arrayBuffer();
  const zip = await unzipXlsxEntries(arr);
  const td = new TextDecoder('utf-8');
  const sharedBytes = await zip.read('xl/sharedStrings.xml');
  const shared = sharedBytes ? parseSharedStrings(td.decode(sharedBytes)) : [];
  const sheetNames = Object.keys(zip.entries)
    .filter(name => /^xl\/worksheets\/sheet\d+\.xml$/i.test(name))
    .sort((a, b) => Number((a.match(/\d+/) || [0])[0]) - Number((b.match(/\d+/) || [0])[0]));
  if (!sheetNames.length) throw new Error('No worksheet was found in the Excel file.');
  if (sheetNames.length > 20) throw new Error('The workbook exceeds 20 worksheets.');

  const sheets = [];
  for (const sheetName of sheetNames) {
    const sheetBytes = await zip.read(sheetName);
    if (!sheetBytes) throw new Error('Worksheet data could not be read.');
    const rows = parseSheetRows(td.decode(sheetBytes), shared);
    if (rows.length > 2500) throw new Error('A worksheet exceeds the 2,500 row CargoRun limit.');
    sheets.push({ name: sheetName.split('/').pop(), rows });
  }
  return { sheets };
}

function cargoRunUwsDraft(document, sourceFile) {
  return {
    type: 'exports',
    documentType: 'EXPORT_UWS',
    flight: document.flightNumber,
    flightDate: document.operatingDate,
    station: document.station,
    destination: document.destination,
    destinations: document.destinations || [],
    sourceFile,
    sourceMetadata: document.sourceMetadata || {},
    bulk: Array.isArray(document.bulk) ? document.bulk : [],
    ulds: (document.ulds || []).map(item => ({
      num: item.uldNumber,
      weight: item.grossWeightKg,
      grossWeightKg: item.grossWeightKg,
      netWeightKg: item.netWeightKg,
      tareWeightKg: item.tareWeightKg,
      pieces: item.pieces,
      destination: item.destination || '',
      contour: item.contour || '',
      remarks: item.remarks || '',
      dryIceText: item.dryIceText || '',
      priority: item.priorityText || '',
      shcs: Array.isArray(item.shcs) ? item.shcs : []
    }))
  };
}

async function parseExportUwsWorkbook(workbook, sourceFileName, generation) {
  if (!operationalSessionIsCurrent(generation)) return null;
  const response = await fetch('/api/manifest-upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ action: 'PARSE_EXPORT_UWS', sourceFileName, workbook })
  });
  const result = await response.json().catch(() => ({}));
  if (!operationalSessionIsCurrent(generation)) return null;
  if (!response.ok || result.ok === false) throw new Error(result.error || `Export UWS parser ${response.status}`);
  const parsed = cargoRunUwsDraft(result.document || {}, sourceFileName);
  parsed.exactFlightId = stableOperationalId(result.exactMatch?.flightId);
  parsed.exactMatch = result.exactMatch || null;
  parsed.reconciliation = result.reconciliation || null;
  parsed._workbook = workbook;
  if (!parsed.exactFlightId) throw new Error('Export UWS did not resolve an exact CargoRun FlightId.');
  return parsed;
}

async function parseCargoRunWorkbook(file, generation) {
  const workbook = await readCargoRunWorkbook(file);
  if (!operationalSessionIsCurrent(generation)) return null;
  const documentType = detectCargoRunWorkbook(workbook);
  if (documentType === 'EXPORT_UWS') return parseExportUwsWorkbook(workbook, file.name, generation);
  const matchingSheet = workbook.sheets.find(sheet => {
    const joined = (sheet.rows || []).flat().map(value => String(value ?? '')).join(' | ').toUpperCase();
    return documentType === 'IMPORT_ULD_SUMMARY'
      ? /IMPORT\s+ULD\s+(LIST|SUMMARY)/.test(joined)
      : /EXPORT\s+(UNIT|ULD)\s+LIST/.test(joined);
  });
  if (!matchingSheet) throw new Error('The detected worksheet could not be read.');
  return { ...parseCargoRunRows(matchingSheet.rows, file.name), documentType };
}
